/* Финальный стейт: фуригана — чтение каной над каждым иероглифом слова */
function furiganaHtml(word){
  if(word.seg&&word.seg.length)
    return`<div class="furi">${word.seg.map(s=>`<ruby>${esc(s.c)}<rt>${esc(s.r)}</rt></ruby>`).join('')}</div>`;
  // нет посимвольной разбивки (дзюкудзикун) — слово целиком + полное чтение
  return`<div class="furi"><ruby>${esc(word.kanji)}<rt>${esc(word.reading)}</rt></ruby></div>`;
}
/* ── COMPOSE ACTIVE (Figma: Составить слова) ── */
function buildComposeActive(q){
  const cs=S.quizCfg.composeShow||{reading:true,meaning:false};
  const reverse=!!q.reverse,ultra=!!q.ultra;
  const built=q.picks.map(i=>q.options[i]);
  const kanaLine=q.word.reading?`<div class="cmp-line"><span class="lbl">kana:</span> <span class="val">${esc(q.word.reading)}</span></div>`:'';
  const meaningLine=q.word.meaning?`<div class="cmp-line"><span class="lbl">meaning:</span> <span class="val">${esc(String(q.word.meaning).split(/;/)[0])}</span></div>`:'';
  let canvasInner;
  if(S.quizDone){
    // Финал: фуригана над иероглифами + (при ошибке) правильный ответ
    const parts=[furiganaHtml(q.word)];
    if((cs.meaning||ultra)&&q.word.meaning)parts.push(meaningLine);
    if(!q.result){
      const corr=reverse?esc(q.word.reading):esc(q.word.kanji);
      parts.push(`<div class="cmp-correct">Правильно: <span>${corr}</span></div>`);
    }
    canvasInner=`<div class="cmp-canvas">${parts.join('')}</div>`;
  } else if(reverse){
    // Reverse: показываем кандзи-слово (+значение), собираем кану
    const slots=[];
    for(let i=0;i<q.target.length;i++)slots.push(built[i]!=null?`<span class="cmp-kana">${esc(built[i])}</span>`:`<span class="cmp-slot"></span>`);
    canvasInner=`<div class="cmp-canvas"><div class="cmp-word">${esc(q.word.kanji)}</div>${cs.meaning?meaningLine:''}<div class="cmp-build">${slots.join('')}</div></div>`;
  } else if(ultra){
    // Ultra: незнакомый кандзи (нет в импорте) стоит на месте; знакомые — слоты,
    // которые юзер подставляет из своих кандзи по значению.
    let ki=0;
    const cells=q.positions.map(pp=>{
      if(!pp.known)return`<span class="cmp-ch">${esc(pp.c)}</span>`; // учимый — показан
      const filled=built[ki++];
      return filled!=null?`<span class="cmp-ch">${esc(filled)}</span>`:`<span class="cmp-slot"></span>`;
    });
    canvasInner=`<div class="cmp-canvas"><div class="cmp-build">${cells.join('')}</div>${meaningLine}</div>`;
  } else {
    // Normal: собираем кандзи, кана/значение как подсказка
    const slots=[];
    for(let i=0;i<q.target.length;i++)slots.push(built[i]!=null?`<span class="cmp-ch">${esc(built[i])}</span>`:`<span class="cmp-slot"></span>`);
    const lines=[];
    if(cs.reading)lines.push(kanaLine);
    if(cs.meaning)lines.push(meaningLine);
    canvasInner=`<div class="cmp-canvas"><div class="cmp-build">${slots.join('')}</div>${lines.join('')}</div>`;
  }
  const canvasCls=S.quizDone?(q.result?' ok':' bad'):'';
  const canvas=`<div class="quiz-q${canvasCls}">${canvasInner}</div>`;
  // Свитчеры: в reverse «Кана» скрыта; в ultra свитчеров нет (значение показано всегда)
  const sw=(k,label)=>`<button class="cmp-sw${cs[k]?' on':''}" data-a="compose-switch:${k}">${cs[k]?'<span class="cmp-arrow">→</span>':''}${label}</button>`;
  const switches=ultra?'':`<div class="cmp-switch">${reverse?'':sw('reading','Кана')}${sw('meaning','Значение')}</div>`;
  // Варианты: кандзи (normal/ultra) или части каны (reverse). В ultra — только знакомые кандзи.
  const opts=q.options.map((o,i)=>{
    const picked=q.picks.includes(i);
    let cls='';
    if(S.quizDone)cls=picked?(q.result?'ok':'bad'):'';
    else if(picked)cls='sel';
    return`<button class="qopt ${reverse?'':'kanji '}${cls}" ${S.quizDone?'disabled':''} data-a="compose-pick:${i}">${esc(o)}</button>`;
  }).join('');
  const panel=`<div class="quiz-panel"><div class="quiz-panel-lbl">Выберите вариант:</div><div class="quiz-opts">${opts}</div></div>`;
  const nextBtn=S.quizDone?`<button class="next-btn" data-a="next-q">Следующий →</button>`:'';
  return`<div class="pg">${qScoreBar()}${canvas}${switches}${panel}${qActions}${nextBtn}</div>`;
}

/* ── PAIRS ACTIVE (Figma: Выбери пару) ── */
function buildPairsActive(q){
  const counter=`<div class="pair-count"><div class="pair-count-pill">${q.found.length}/${q.total}</div></div>`;
  // Канвас
  let canvasInner,canvasCls='';
  const slot=(o,withMeaning)=>`<div class="pair-slot"><div class="pk">${esc(o.kanji)}</div>${withMeaning&&o.meaning?`<div class="pm">meaning: <b>${esc(o.meaning)}</b></div>`:''}</div>`;
  if(q.result){
    const a=q.options[q.result.a],b=q.options[q.result.b];
    canvasCls=q.result.ok?' ok':' bad';
    const readings=q.result.ok
      ?`<div class="pair-on"><span class="lbl">on:</span> <span class="val">${esc(a.onRaw)}</span></div>`
      :`<div class="pair-on"><span class="val">${esc(a.onRaw)}</span> <span class="lbl">≠</span> <span class="val">${esc(b.onRaw)}</span></div>`;
    canvasInner=`<div class="pair-canvas"><div class="pair-slots">${slot(a,q.result.ok)}${slot(b,q.result.ok)}</div>${readings}</div>`;
  } else if(q.firstPick!=null){
    const a=q.options[q.firstPick];
    canvasInner=`<div class="pair-canvas"><div class="pair-slots">${slot(a,false)}</div></div>`;
  } else {
    canvasInner=`<div class="pair-canvas"><div class="pair-hint">Выберите два иероглифа с одинаковым он-чтением</div></div>`;
  }
  const canvas=`<div class="quiz-q${canvasCls}">${canvasInner}</div>`;
  // Варианты
  const opts=q.options.map((o,i)=>{
    const found=q.found.some(f=>f.includes(i));
    const sel=q.firstPick===i;
    let cls=found?'ok':sel?'sel':'';
    const label=found?`${esc(o.kanji)}<span class="qopt-on">${esc(o.onRaw)}</span>`:esc(o.kanji);
    return`<button class="qopt kanji ${cls}" ${found||S.quizDone?'disabled':''} data-a="pairs-pick:${i}">${label}</button>`;
  }).join('');
  const panel=`<div class="quiz-panel"><div class="quiz-panel-lbl">Выберите вариант:</div><div class="quiz-opts">${opts}</div></div>`;
  const nextBtn=S.quizDone?`<button class="next-btn" data-a="next-q">Следующий →</button>`:'';
  return`<div class="pg">${qScoreBar()}${counter}${canvas}${panel}${qActions}${nextBtn}</div>`;
}

/* ── VERB FORMS ACTIVE (Figma: Спряжение глаголов) ──
 * Задание (русское, из флагов) + основа глагола; собрать нужную форму из окончаний. */
// фуригана над основой: ruby на весь кусок основы (корректно и для составных глаголов
// типа 役に立つ, где между кандзи есть кана). kuru/suru пропускаем — у них меняется чтение.
function vbFuriStem(v,stemJp){
  const chars=[...stemJp];
  if(!chars.some(isKanjiChar)||v.t==='kuru'||v.t==='suru')return`<span class="vb-base">${esc(stemJp)}</span>`;
  const rr=[...v.r],okLen=[...v.d].length-chars.length;   // окуригана за пределами основы
  const read=okLen>=0?rr.slice(0,rr.length-okLen).join(''):'';
  if(!read)return`<span class="vb-base">${esc(stemJp)}</span>`;
  return`<span class="vb-base"><ruby>${esc(stemJp)}<rt>${esc(read)}</rt></ruby></span>`;
}
function buildVerbActive(q){
  const filled=q.picks.map(i=>q.options[i]);   // выбранные окончания по порядку слотов
  const taskLine=`<div class="vb-task">${esc(q.task)}</div>`;
  const meaningLine=`<div class="cmp-line"><span class="lbl">${esc(q.verb.d)}</span> <span class="val">${esc(String(q.verb.m).split(/[;,]/)[0])}</span></div>`;
  // подсказка грамматики (Mode A): какую конструкцию собирать. В Mode B скрыта — только смысл.
  const gramLine=q.modeB?'':`<div class="vb-gram">${esc(q.rule.gl||q.rule.nm)}</div>`;
  let slots;
  if(q.modeB){
    // переменная длина: показываем собранные чипы + один пустой слот, пока есть куда добавлять
    const chips=filled.map(j=>`<span class="vb-suf${S.quizDone?(q.result?' ok':' bad'):''}">${esc(j)}</span>`).join('');
    const tail=(!S.quizDone&&q.picks.length<q.maxLen)?`<span class="vb-slot"></span>`:'';
    slots=chips+tail;
  }else{
    slots=q.target.map((_,i)=>filled[i]!=null
      ?`<span class="vb-suf${S.quizDone?(q.result?' ok':' bad'):''}">${esc(filled[i])}</span>`
      :`<span class="vb-slot"></span>`).join('');
  }
  const wordHtml=`<div class="vb-word">${vbFuriStem(q.verb,q.stem.jp)}${slots}</div>`;
  let correctLine='';
  if(S.quizDone&&!q.result){
    const ans=q.modeB?(q.stem.jp+q.accepted[0].seq.join('')):(q.stem.jp+q.target.join(''));
    correctLine=`<div class="cmp-correct">Правильно: <span>${esc(ans)}</span></div>`;
  }
  const canvasCls=S.quizDone?(q.result?' ok':' bad'):'';
  const canvas=`<div class="quiz-q${canvasCls}"><div class="cmp-canvas">${taskLine}${meaningLine}${gramLine}${wordHtml}${correctLine}</div></div>`;
  // Банк окончаний — hug-content чипы (как в дуалинго)
  const opts=q.options.map((o,i)=>{
    const at=q.picks.indexOf(i);let cls='';
    if(S.quizDone){ if(at>=0)cls=q.modeB?(q.result?'ok':'bad'):((o===q.target[at])?'ok':'bad'); }
    else if(at>=0)cls='on';
    return`<button class="qchip ${cls}" ${S.quizDone?'disabled':''} data-a="verb-pick:${i}">${esc(o)}</button>`;
  }).join('');
  const bankLbl=q.modeB?'Соберите форму — способ выберите сами:':'Соберите нужную форму глагола:';
  const panel=`<div class="quiz-panel"><div class="quiz-panel-lbl">${bankLbl}</div><div class="quiz-bank">${opts}</div></div>`;
  const checkBtn=(q.modeB&&!S.quizDone&&q.picks.length)?`<button class="next-btn" data-a="verb-check">Проверить</button>`:'';
  const nextBtn=S.quizDone?`<button class="next-btn" data-a="next-q">Следующий →</button>`:'';
  return`<div class="pg">${qScoreBar()}${canvas}${panel}${checkBtn}${qActions}${nextBtn}</div>`;
}

/* ── WORDS ── */
function buildWords(){
  const type=S.wordsTab,d=ds(type),p=pr(type);
  const folders=foldersOf(type);
  let wf=S.wordsFolder;
  if(wf!=='all'&&!folders.includes(wf)){wf=S.wordsFolder='all';}
  const base=wf==='all'?d:d.filter(w=>(w.folder||'Общая')===wf);
  const list=S.wordsSearch
    ?base.filter(w=>{const q=S.wordsSearch.toLowerCase();
        return(w.kanji||'').toLowerCase().includes(q)||
               (w.reading||w.on_reading||w.kun_reading||'').toLowerCase().includes(q)||
               (w.meaning||w.translation||'').toLowerCase().includes(q);})
    :base;
  const showFolderTag=wf==='all'&&folders.length>1;
  const checkSvg=`<svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5l4 4L13 1" stroke="#7aff78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const seg=`<div class="nseg" style="padding-top:24px">
      <button class="nseg-btn${type==='words'?' on':''}" data-a="words-tab:words">Слова</button>
      <button class="nseg-btn${type==='kanji'?' on':''}" data-a="words-tab:kanji">Кандзи</button>
    </div>`;
  const importBtn=`<button class="nimport" style="margin:0 16px 8px;grid-column:auto" data-a="words-import"><img src="${ASSETS.cImport}" alt="">Импортировать</button>`;
  const search=`<div class="dsearch">
      <img class="dsearch-ic" src="${ASSETS.cSearch}" alt="">
      <input id="words-search" class="dsearch-inp" type="text" placeholder="Поиск..." value="${esc(S.wordsSearch)}" autocomplete="off" autocorrect="off">
    </div>`;
  const folderTabs=folders.length>1?`<div class="wfilter" style="overflow-x:auto;flex-wrap:nowrap">
      <button class="wf-tab${wf==='all'?' on':''}" style="flex:none" data-a="words-folder:all">Все папки</button>
      ${folders.map(f=>`<button class="wf-tab${wf===f?' on':''}" style="flex:none" data-a="words-folder:${esc(f)}">${esc(f)}</button>`).join('')}
    </div>`:'';
  const item=w=>{
    const s=statusOf(p,w.id);
    const st=s==='know'?`<span class="ditem-st know">${checkSvg}</span>`:`<span class="ditem-st ${s}"><span class="dot"></span></span>`;
    const ft=showFolderTag&&(w.folder||'Общая')!=='Общая'?`<div class="dfolder">📁 ${esc(w.folder)}</div>`:'';
    let reading;
    if(type==='kanji'){
      const parts=[];if(w.on_reading)parts.push('он '+esc(w.on_reading));if(w.kun_reading)parts.push('кун '+esc(w.kun_reading));
      reading=parts.join(' · ');
    }else reading=esc(w.reading||'');
    const meaning=esc(w.meaning||w.translation||'');
    return`<div class="ditem">
        <span class="ditem-k">${esc(w.kanji)}</span>
        <span class="ditem-info">${reading?`<span class="ditem-r">${reading}</span>`:''}${meaning?`<span class="ditem-m">${meaning}</span>`:''}${ft}</span>
        ${st}
      </div>`;
  };
  return`
    ${seg}
    ${importBtn}
    ${search}
    ${folderTabs}
    ${!d.length
      ?`<div class="empty"><div class="ei">${type==='kanji'?'㊙️':'📖'}</div><div class="et">Нет ${type==='kanji'?'кандзи':'слов'}</div><div class="eb">Импортируйте CSV/TSV файл</div><button class="btn btn-p" style="margin:0 16px;width:calc(100% - 32px)" data-a="words-import">Импортировать</button></div>`
      :!base.length
      ?`<div class="empty"><div class="ei">📁</div><div class="et">Папка пуста</div><div class="eb">В папке «${esc(wf)}» пока нет ${type==='kanji'?'кандзи':'слов'}</div></div>`
      :`<div class="dlist">${list.map(item).join('')}</div>
        ${list.length!==base.length?`<div style="font-size:12px;color:var(--al);text-align:center;padding:6px">Найдено: ${list.length} из ${base.length}</div>`:''}`
    }`;
}

/* ── Actions ── */
function act(action){
  const ci=action.indexOf(':');
  const type=ci>-1?action.slice(0,ci):action;
  const val=ci>-1?action.slice(ci+1):'';

  switch(type){
    case'tab':
      S.tab=val;S.confirmPending=null;S.cfgScreen=null;
      S.studyQueue=[];S.studyResults=null;S.quizQ=null;S.quizDone=false;
      break;
    case'home-tab':   S.homeTab=val;break;
    case'words-tab':  S.wordsTab=val;S.wordsSearch='';S.wordsFolder='all';break;
    case'words-folder':S.wordsFolder=val;break;
    case'words-search-toggle': document.getElementById('words-search')?.focus(); return;

    // Открыть экран настроек режима с карточки на главной
    case'open-cfg':{
      const type=S.homeTab;
      if(val==='cards'){
        if(S.studyCfg.type!==type){
          S.studyCfg.type=type;S.studyCfg.front=['kanji'];S.studyCfg.folders=[];
          S.studyCfg.back=type==='kanji'?['on_reading','kun_reading','meaning']:['reading','meaning'];
        }
        S.studyQueue=[];S.studyResults=null;S.cfgScreen='cards';
      }else{
        if(S.quizCfg.type!==type){
          S.quizCfg.type=type;S.quizCfg.folders=[];S.quizCfg.question=['kanji'];
          S.quizCfg.answer=[type==='kanji'?'on_reading':'reading'];
        }
        if(val==='quiz-compose')S.quizCfg.mode='compose';
        else if(val==='quiz-pairs')S.quizCfg.mode='pairs';
        else if(val==='quiz-verbs')S.quizCfg.mode='verbs';
        else if(['compose','pairs','verbs'].includes(S.quizCfg.mode))S.quizCfg.mode='choice6';
        S.quizQ=null;S.quizDone=false;S.cfgScreen='quiz';
      }
      break;}
    case'cfg-type':{
      // Переключение типа сегментом внутри экрана настроек режима
      S.homeTab=val;
      if(S.cfgScreen==='cards'){
        if(S.studyCfg.type!==val){
          S.studyCfg.type=val;S.studyCfg.front=['kanji'];S.studyCfg.folders=[];
          S.studyCfg.back=val==='kanji'?['on_reading','kun_reading','meaning']:['reading','meaning'];
        }
      }else{
        if(S.quizCfg.type!==val){
          S.quizCfg.type=val;S.quizCfg.folders=[];S.quizCfg.question=['kanji'];
          S.quizCfg.answer=[val==='kanji'?'on_reading':'reading'];
          if(val!=='kanji'&&['pairs','compose'].includes(S.quizCfg.mode))S.quizCfg.mode='choice6';
        }
      }
      break;}
    case'close-cfg':
      S.cfgScreen=null;S.studyQueue=[];S.studyResults=null;S.quizQ=null;S.quizDone=false;break;
    case'go-cards':
      S.studyCfg.type=S.homeTab;S.studyQueue=[];S.studyResults=null;S.cfgScreen='cards';break;
    case'go-quiz':
      S.quizCfg.type=S.homeTab;S.quizQ=null;S.quizDone=false;S.cfgScreen='quiz';break;
    case'go-import-home':
      S.screen='import';S.importType=S.homeTab;S.importStep='type';S.importPreview=null;S.importErr=null;S.importRaw=null;
      S.importFolder='Общая';S.importNewFolder=false;S.importNewName='';break;
    case'words-import':
      S.screen='import';S.importType=S.wordsTab;S.importStep='type';S.importPreview=null;S.importErr=null;S.importRaw=null;
      S.importNewFolder=false;S.importNewName='';
      S.importFolder=(S.wordsFolder&&S.wordsFolder!=='all')?S.wordsFolder:'Общая';
      break;

    case'import-type':
      S.importType=val;
      // Если уже в шаге маппинга — обновить дефолтные подписи колонок
      if(S.importRaw)S.importMapping=defaultMapping(S.importRaw.colCount,val==='kanji');
      break;
    case'import-folder':S.importFolder=val;S.importNewFolder=false;break;
    case'import-folder-new':S.importNewFolder=true;break;
    case'back-import':
      if(S.importStep==='map'){S.importStep='type';S.importRaw=null;S.importMapping=[];}
      else if(S.importStep==='preview'){S.importStep=S.importRaw?'map':'type';S.importPreview=null;}
      else{S.screen='main';S.importStep='type';S.importPreview=null;S.importErr=null;S.importRaw=null;}
      break;
    case'cancel-import':S.importPreview=null;S.importStep=S.importRaw?'map':'type';break;
    case'apply-map':{
      if(!S.importRaw)break;
      const mapping=Array.from({length:S.importRaw.colCount},(_,i)=>{
        const el=document.getElementById(`map-col-${i}`);return el?el.value:(S.importMapping[i]||'');
      });
      if(!mapping.includes('kanji')&&!mapping.includes('reading')){toast('Назначьте колонку кандзи или чтения');return;}
      try{S.importPreview=applyMapping(S.importRaw.rawRows,mapping,S.importType==='kanji');S.importStep='preview';S.importErr=null;}
      catch(e){S.importErr=e.message;}
      break;
    }
    case'confirm-import':
      if(S.importPreview){
        const nw=S.importPreview.words;
        const itype=S.importType;
        const targetFolder=importTargetFolder();
        if(itype==='kanji'){
          // Страховочный проход: если reading не был разбит на on/kun — делаем это сейчас
          nw.forEach(w=>{
            if(w.reading&&!w.on_reading&&!w.kun_reading){
              const{on_reading,kun_reading}=splitOnKun(w.reading);
              if(on_reading)w.on_reading=on_reading;
              if(kun_reading)w.kun_reading=kun_reading;
              delete w.reading;
            }
          });
        }
        // Дедупликация в пределах целевой папки по ключу «слово + чтение».
        // Существующие записи не трогаем (прогресс сохраняется), дубли пропускаем.
        const list=itype==='kanji'?S.kanjiItems:S.words;
        const existing=new Set(list.filter(w=>(w.folder||'Общая')===targetFolder).map(w=>itemKey(w,itype)));
        const seen=new Set();
        let added=0,skipped=0;
        for(const w of nw){
          const k=itemKey(w,itype);
          if(existing.has(k)||seen.has(k)){skipped++;continue;}
          seen.add(k);
          w.folder=targetFolder;
          list.push(w);
          added++;
        }
        if(itype==='kanji')S.kanjiCsv=S.importRawText||'';
        else S.wordsCsv=S.importRawText||'';
        S.importRawText='';
        S.importPreview=null;S.importRaw=null;S.importStep='type';S.screen='main';
        S.importNewFolder=false;S.importNewName='';
        // Показать импортированную папку в разделе «Слова»
        S.tab='words';S.wordsTab=itype;S.wordsFolder=targetFolder;S.wordsSearch='';
        save();
        toast(skipped?`Добавлено ${added}, пропущено дублей: ${skipped}`:`Добавлено ${added}`);
      }
      break;

    case'study-type':
      S.studyCfg.type=val;S.studyCfg.front=['kanji'];S.studyCfg.folders=[];
      S.studyCfg.back=val==='kanji'?['on_reading','kun_reading','meaning']:['reading','meaning'];break;
    case'study-folder':
      if(val==='__all__')S.studyCfg.folders=[];
      else{const a=S.studyCfg.folders||[];S.studyCfg.folders=a.includes(val)?a.filter(x=>x!==val):[...a,val];}
      break;
    case'study-front':S.studyCfg.front=val;break;
    case'study-filter':S.studyCfg.filter=val;break;
    case'study-count':S.studyCfg.count=val;break;
    case'start-study':
      S.studyQueue=buildStudyQueue();
      if(!S.studyQueue.length){toast('Нет карточек для этого фильтра');return;}
      S.studyIdx=0;S.cardFlipped=false;S.studyResults=null;S.cardHint=false;break;
    case'flip':S.cardFlipped=!S.cardFlipped;haptic('light');break;
    case'mark':{
      const w=S.studyQueue[S.studyIdx];
      if(w){
        const q=val==='know'?5:val==='learning'?3:0;
        smOverwrite(pr(S.studyCfg.type),w.id,q);
        save();haptic();S.studyIdx++;S.cardFlipped=false;
        if(S.studyIdx>=S.studyQueue.length)sessionEnd();
      }
      break;}
    case'skip-card':
      S.studyIdx++;S.cardFlipped=false;
      if(S.studyIdx>=S.studyQueue.length)sessionEnd();break;
    case'stop-study':
      S.studyQueue=[];S.studyResults=null;S.cardHint=false;S.cfgScreen='cards';break;
    case'restart-study':
      S.studyQueue=buildStudyQueue();S.studyIdx=0;S.cardFlipped=false;S.studyResults=null;break;

    case'quiz-type':
      S.quizCfg.type=val;S.quizCfg.folders=[];
      S.quizCfg.question=['kanji'];
      S.quizCfg.answer=[val==='kanji'?'on_reading':'reading'];
      if(val!=='kanji'&&['pairs','compose'].includes(S.quizCfg.mode))S.quizCfg.mode='choice6';
      break;
    case'quiz-folder':
      if(val==='__all__')S.quizCfg.folders=[];
      else{const a=S.quizCfg.folders||[];S.quizCfg.folders=a.includes(val)?a.filter(x=>x!==val):[...a,val];}
      break;
    case'quiz-mode':
      S.quizCfg.mode=val;break;
    case'quiz-afield':{
      // Мультивыбор «что отгадываем» (минимум одно поле)
      const a=arr(S.quizCfg.answer);
      S.quizCfg.answer=a.includes(val)
        ?(a.length>1?a.filter(x=>x!==val):a)
        :[...a,val];
      break;}
    case'quiz-filter':S.quizCfg.filter=val;break;
    case'quiz-count':S.quizCfg.count=val;break;
    case'word-display':S.wordDisplay=(val==='kana'?'kana':'full');save();break;
    case'hints-toggle':S.hintsEnabled=(val==='on');save();break;
    case'start-quiz':{
      const aFields=arr(S.quizCfg.answer);
      const d=ds(S.quizCfg.type);
      const mode=S.quizCfg.mode;
      const fieldModes=mode==='pairs'||mode==='compose'||mode==='verbs';
      if(!fieldModes&&!aFields.some(f=>d.some(w=>w[f]))){toast(`Поле "${fldShort(aFields[0],S.quizCfg.type)}" пустое во всех записях`);break;}
      S.quizRecent=[];
      S.quizScore={ok:0,bad:0};S.quizQ=nextQuizQ();S.quizDone=false;S.quizSel=-1;S.quizInputVal='';S.quizHint=false;
      if(!S.quizQ)toast(startQuizError());
      break;}
    case'quiz-check':{
      if(!S.quizDone&&S.quizQ){
        const inp=document.getElementById('quiz-input');
        S.quizInputVal=inp?inp.value:'';S.quizDone=true;
        const ok=checkAns(S.quizInputVal,S.quizQ.options[S.quizQ.correct]);
        const w=S.quizQ.word,p=pr(S.quizCfg.type);
        smUpdate(p,w.id,ok?5:1);
        if(ok){S.quizScore.ok++;haptic('light');}
        else{S.quizScore.bad++;haptic('medium');}
        save();
      }
      break;}
    case'toggle-hint':S.quizHint=!S.quizHint;break;
    case'toggle-card-hint':S.cardHint=!S.cardHint;break;
    case'compose-switch':{
      const cs=S.quizCfg.composeShow||{reading:true,meaning:false};
      cs[val]=!cs[val];
      // в normal нужна хотя бы одна подсказка; в reverse слово-кандзи видно всегда
      if(S.quizCfg.composeMode==='normal'&&!cs.reading&&!cs.meaning)cs[val]=true;
      S.quizCfg.composeShow=cs;save();break;}
    case'compose-dir':S.quizCfg.composeMode=(['normal','reverse','ultra'].includes(val)?val:'normal');save();break;
    case'ultra-diff':S.quizCfg.ultraDifficulty=(['all','easy','medium','hard'].includes(val)?val:'all');save();break;
    case'verb-style':S.quizCfg.verbStyle=(['plain','polite','both'].includes(val)?val:'both');save();break;
    case'verb-level':S.quizCfg.verbLevel=(['easy','medium','hard'].includes(val)?val:'medium');save();break;
    case'verb-source':S.quizCfg.verbSource=(['all','known'].includes(val)?val:'all');save();break;
    case'verb-mode':S.quizCfg.verbMode=(['A','B'].includes(val)?val:'A');save();break;
    case'verb-cat':{
      const a=S.quizCfg.verbCats||[];
      S.quizCfg.verbCats=a.includes(val)?(a.length>1?a.filter(x=>x!==val):a):[...a,val];
      save();break;}
    case'compose-pick':{
      const q=S.quizQ;if(!q||!q.compose||S.quizDone)break;
      const i=+val,at=q.picks.indexOf(i);
      if(at>=0){q.picks.splice(at,1);haptic('light');break;} // отжать
      q.picks.push(i);haptic('light');
      if(q.picks.length===q.target.length){
        const built=q.picks.map(x=>q.options[x]).join('');
        // reverse — чтение; ultra — знакомые кандзи по порядку слотов; обычный — всё слово
        const answer=q.reverse?String(q.word.reading):(q.ultra?q.target.join(''):String(q.word.kanji));
        const ok=built===answer;
        q.result=ok;S.quizDone=true;
        smUpdate(pr('words'),q.word.id,ok?4:1);
        if(ok){S.quizScore.ok++;haptic('light');}else{S.quizScore.bad++;haptic('medium');}
        save();
      }
      break;}
    case'verb-pick':{
      const q=S.quizQ;if(!q||!q.verbs||S.quizDone)break;
      const i=+val,at=q.picks.indexOf(i);
      if(at>=0){q.picks.splice(at,1);haptic('light');break;} // отжать чип
      if(q.modeB){
        if(q.picks.length>=q.maxLen)break;                   // не длиннее самого длинного ответа
        q.picks.push(i);haptic('light');
        const built=q.picks.map(x=>q.options[x]);
        if(q.accepted.some(a=>seqEq(a.seq,built))){          // авто-приём при точном совпадении
          q.result=true;S.quizDone=true;S.quizScore.ok++;haptic('light');save();
        }
        break;
      }
      if(q.picks.length>=q.target.length)break;              // все слоты заняты
      q.picks.push(i);haptic('light');
      if(q.picks.length===q.target.length){
        const built=q.picks.map(x=>q.options[x]);
        const ok=built.every((c,k)=>c===q.target[k]);
        q.result=ok;S.quizDone=true;
        if(ok){S.quizScore.ok++;haptic('light');}else{S.quizScore.bad++;haptic('medium');}
        save();
      }
      break;}
    case'verb-check':{                                        // Mode B: явная проверка сборки
      const q=S.quizQ;if(!q||!q.verbs||!q.modeB||S.quizDone||!q.picks.length)break;
      const built=q.picks.map(x=>q.options[x]);
      const ok=q.accepted.some(a=>seqEq(a.seq,built));
      q.result=ok;S.quizDone=true;
      if(ok){S.quizScore.ok++;haptic('light');}else{S.quizScore.bad++;haptic('medium');}
      save();break;}
    case'pairs-pick':{
      const q=S.quizQ;if(!q||!q.pairs||S.quizDone)break;
      const i=+val;
      if(q.found.some(f=>f.includes(i)))break; // уже собран
      if(q.firstPick==null){q.firstPick=i;q.result=null;haptic('light');break;}
      if(i===q.firstPick){q.firstPick=null;q.result=null;break;} // отжать
      const a=q.options[q.firstPick],b=q.options[i];
      if(a.on===b.on){
        q.found.push([q.firstPick,i]);
        q.result={ok:true,a:q.firstPick,b:i};
        haptic('light');
      }else{
        q.wrong++;
        q.result={ok:false,a:q.firstPick,b:i};
        haptic('medium');
      }
      q.firstPick=null;
      if(q.found.length>=q.total){
        const p=pr('kanji');
        q.options.forEach(o=>smUpdate(p,o.id,q.wrong===0?5:3));
        if(q.wrong===0)S.quizScore.ok++;else S.quizScore.bad++;
        S.quizDone=true;save();
      }
      break;}
    case'multi-pick':{
      const q=S.quizQ;if(!q||!q.multi||q.useInput||S.quizDone)break;
      const p=val.split(':');const gi=+p[0],oi=+p[1];
      if(q.picks[gi]!=null)break;
      q.picks[gi]=oi;
      haptic(oi===q.groups[gi].correctIdx?'light':'medium');
      if(q.groups.every((_,i)=>q.picks[i]!=null))finishMulti(q);
      break;}
    case'multi-check':{
      const q=S.quizQ;if(!q||!q.multi||!q.useInput||S.quizDone)break;
      q.inputs={};
      q.groups.forEach((g,gi)=>{const el=document.getElementById('multi-input-'+gi);q.inputs[gi]=el?el.value:'';});
      finishMulti(q);
      break;}
    case'quiz-ans':{
      if(!S.quizDone&&S.quizQ){
        const idx=parseInt(val);S.quizSel=idx;S.quizDone=true;
        const ok=idx===S.quizQ.correct;
        const w=S.quizQ.word,p=pr(S.quizCfg.type);
        smUpdate(p,w.id,ok?4:1);
        if(ok){S.quizScore.ok++;haptic('light');}
        else{S.quizScore.bad++;haptic('medium');}
        save();
      }
      break;}
    case'next-q':
      S.quizQ=nextQuizQ();S.quizDone=false;S.quizSel=-1;S.quizInputVal='';
      if(!S.quizQ)toast(startQuizError());break;
    case'skip-q':
      // Пропуск без оценки — просто следующий вопрос
      S.quizQ=nextQuizQ();S.quizDone=false;S.quizSel=-1;S.quizInputVal='';
      if(!S.quizQ)toast(startQuizError());break;
    case'stop-quiz':
      S.quizQ=null;S.quizDone=false;S.quizInputVal='';S.quizHint=false;
      S.quizScore={ok:0,bad:0};S.quizSel=-1;S.quizRecent=[];
      S.cfgScreen='quiz';break;

    case'download-csv':{
      const csv=val==='kanji'?S.kanjiCsv:S.wordsCsv;
      if(!csv){toast('CSV не сохранён');return;}
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=val==='kanji'?'kanji.csv':'words.csv';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return;}
    case'reset-progress':S.confirmPending='reset-progress';break;
    case'clear-words':   S.confirmPending='clear-words';break;
    case'confirm-no':    S.confirmPending=null;break;
    case'confirm-yes':
      if(S.confirmPending==='reset-progress'){
        S.progress={};S.kanjiProgress={};save();toast('Прогресс сброшен');
      } else if(S.confirmPending==='clear-words'){
        S.words=[];S.progress={};S.kanjiItems=[];S.kanjiProgress={};
        S.wordsCsv='';S.kanjiCsv='';
        S.studyQueue=[];S.quizQ=null;save();toast('Данные удалены');
      }
      S.confirmPending=null;break;
  }
  render();
}

/* ── Events ── */
function setupDelegation(){
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-a]');if(el)act(el.dataset.a);
  });
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    if(!S.quizQ)return;
    const qi=document.getElementById('quiz-input');
    const inMulti=S.quizQ.multi&&S.quizQ.useInput;
    const ae=document.activeElement;
    const inMultiInput=inMulti&&ae&&/^multi-input-/.test(ae.id||'');
    if(qi&&ae===qi){
      e.preventDefault();
      act(S.quizDone?'next-q':'quiz-check');
    } else if(inMultiInput){
      e.preventDefault();
      act(S.quizDone?'next-q':'multi-check');
    } else if(S.quizDone){
      // После ответа Enter где угодно — следующий
      e.preventDefault();act('next-q');
    }
  });
}
function bindAll(){
  // Front-chips toggle (study, multi-select)
  const cf=document.getElementById('chips-front');
  if(cf)cf.addEventListener('click',e=>{
    const chip=e.target.closest('[data-field-front]');if(!chip)return;
    const f=chip.dataset.fieldFront,i=S.studyCfg.front.indexOf(f);
    if(i>=0)S.studyCfg.front=S.studyCfg.front.filter(x=>x!==f);
    else S.studyCfg.front=[...S.studyCfg.front,f];
    chip.classList.toggle('on',S.studyCfg.front.includes(f));
  });
  // Back-chips toggle (study)
  const cb=document.getElementById('chips-back');
  if(cb)cb.addEventListener('click',e=>{
    const chip=e.target.closest('[data-field]');if(!chip)return;
    const f=chip.dataset.field,i=S.studyCfg.back.indexOf(f);
    if(i>=0)S.studyCfg.back=S.studyCfg.back.filter(x=>x!==f);
    else S.studyCfg.back=[...S.studyCfg.back,f];
    chip.classList.toggle('on');
  });
  // Question-chips toggle (quiz, multi-select)
  const cq=document.getElementById('chips-q');
  if(cq)cq.addEventListener('click',e=>{
    const chip=e.target.closest('[data-qfield]');if(!chip)return;
    const f=chip.dataset.qfield;
    const i=S.quizCfg.question.indexOf(f);
    if(i>=0){if(S.quizCfg.question.length>1)S.quizCfg.question=S.quizCfg.question.filter(x=>x!==f);}
    else S.quizCfg.question=[...S.quizCfg.question,f];
    chip.classList.toggle('on',S.quizCfg.question.includes(f));
  });
  // Word search
  const ws=document.getElementById('words-search');
  if(ws){
    ws.addEventListener('input',e=>{S.wordsSearch=e.target.value;render();});
  }
  // Имя новой папки при импорте — синхронизируем без ре-рендера (фокус сохраняется)
  const fni=document.getElementById('import-folder-name');
  if(fni)fni.oninput=e=>{S.importNewName=e.target.value;};
  // File drop
  const dz=document.getElementById('dropzone'),fin=document.getElementById('file-in');
  if(dz&&fin){
    dz.onclick=()=>fin.click();
    fin.onchange=e=>{const f=e.target.files[0];if(f)readFile(f);};
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
    dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readFile(f);};
  }
  // Quiz input focus — только при первом маунте текущего вопроса,
  // чтобы не переуводить курсор при каждом re-render во время взаимодействия
  const qi=document.getElementById('quiz-input');
  if(qi&&!S.quizDone){
    const qid=S.quizQ&&S.quizQ.word?S.quizQ.word.id:null;
    if(qid&&S._quizFocusedFor!==qid){
      S._quizFocusedFor=qid;
      setTimeout(()=>qi.focus(),50);
    }
  } else if(S.quizDone){
    // Сброс маркера, чтобы следующий вопрос снова получил фокус
    S._quizFocusedFor=null;
  }
}
function readFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const text=e.target.result;
      S.importRawText=text;
      const r=parseFile(text);
      if(!r.hasHeaders){S.importRaw=r;S.importMapping=defaultMapping(r.colCount,S.importType==='kanji');S.importStep='map';S.importPreview=null;S.importErr=null;}
      else{S.importPreview=r;S.importStep='preview';S.importRaw=null;S.importErr=null;}
    }catch(err){S.importErr=err.message;S.importPreview=null;S.importRaw=null;S.importStep='type';}
    render();
  };
  reader.readAsText(file,'UTF-8');
}

/* ── Boot ── */
load();
setupDelegation();
render();
</script>
