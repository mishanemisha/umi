<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>日本語</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;
  --c:#1c1c1c;        /* card surface */
  --card:#161616;     /* новый дизайн: поверхность блоков */
  --stroke:#303030;   /* новый дизайн: обводка */
  --rad:4px;          /* новый дизайн: скругление */
  --c2:#272727;       /* darker surface / progress bg */
  --nav:#161616;      /* tab bar bg */
  --a:#3f6fcf;        /* accent */
  --al:#6998d5;       /* accent-light / section labels */
  --t:#fff;           /* text */
  --t2:#6998d5;       /* secondary text */
  --ic:#434343;       /* inactive icon */
  --g:#7aff78;        /* green / знаю */
  --y:#fff285;        /* yellow / учу */
  --r:#ff3c3c;        /* red / не знаю */
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding-bottom:110px;min-height:100vh}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pg{animation:up .16s ease;padding:0 16px}

/* ─── Tab bar ─── */
.bnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--bg);
  display:flex;align-items:flex-start;justify-content:space-around;
  padding:8px 8px 22px;z-index:200;
}
.bnav-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:none;cursor:pointer;
  color:var(--ic);font-size:13px;font-weight:500;
  padding:4px 12px;transition:color .15s;
  min-width:64px;
}
.bnav-btn.active{color:var(--a)}
.bnav-icon{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
}
.bnav-icon img{width:100%;height:100%;object-fit:contain;display:block}
.bnav-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ─── top_icon ─── */
.top-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--a);line-height:1;flex-shrink:0}
.top-icon img{width:100%;height:100%;object-fit:contain;display:block}
.hero-icon{display:flex;justify-content:center;padding:16px 16px 12px}
.hero-icon img{width:60px;height:auto;display:block}

/* ─── Page header ─── */
.phdr{padding:16px 16px 8px;display:flex;align-items:center;gap:12px}
.phdr-title{font-size:24px;font-weight:700;flex:1}
.phdr-back{background:var(--c);border:none;color:var(--t);font-size:13px;cursor:pointer;padding:7px 14px;border-radius:300px}

/* ─── Type tabs (Слова | Кандзи) ─── */
.ttabs{display:flex;gap:8px;padding:4px 16px 12px}
.ttab{padding:8px 20px;border-radius:300px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;background:var(--c);color:var(--t)}
.ttab.on{background:var(--a);color:#fff}

/* ─── Stats row ─── */
.stats{display:flex;gap:8px;padding:0 16px 12px}
.sbox{flex:1;background:var(--c);border-radius:16px;padding:14px 10px;text-align:center}
.snum{font-size:36px;font-weight:400;line-height:1}
.slbl{font-size:12px;color:var(--t);margin-top:4px}
.sbox.g .snum{color:var(--g)}
.sbox.y .snum{color:var(--y)}
.sbox.r .snum{color:var(--r)}

/* ─── Progress card ─── */
.prog-card{margin:0 16px 12px;background:var(--c);border-radius:16px;padding:14px 16px}
.prog-bar-wrap{height:6px;background:var(--c2);border-radius:300px;overflow:hidden;margin-bottom:8px}
.prog-bar{height:100%;background:var(--al);border-radius:300px;transition:width .4s}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--al)}

/* ─── Action grid (Главная) ─── */
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px}
.act-btn{background:var(--c);border:none;color:var(--t);border-radius:16px;padding:14px;cursor:pointer;text-align:left;transition:background .15s;min-height:58px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.act-btn:active{background:var(--c2)}
.act-btn.primary{background:var(--a)}
.act-btn.primary:active{background:#2f5fbd}

/* ─── New home (redesign: radius 4, #161616, обводки) ─── */
.nlogo{display:flex;justify-content:center;padding:24px 0 18px}
.nlogo img{width:52px;height:52px;object-fit:contain;display:block}
.nseg{display:flex;gap:8px;padding:0 16px 8px}
.nseg-btn{flex:1;height:60px;border:1px solid var(--stroke);border-radius:var(--rad);background:var(--card);color:var(--t);font-size:16px;font-weight:400;cursor:pointer;transition:background .15s,border-color .15s}
.nseg-btn.on{background:var(--a);border-color:var(--a);color:#fff}
.nstats{display:flex;gap:8px;padding:0 16px 8px}
.nstat{flex:1;background:var(--card);border-radius:var(--rad);padding:8px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nstat .n{font-size:36px;font-weight:400;line-height:1}
.nstat .l{font-size:12px;color:var(--t)}
.nstat.g .n{color:var(--g)}.nstat.y .n{color:var(--y)}.nstat.r .n{color:var(--r)}
.nprog{background:var(--card);border-radius:var(--rad);padding:8px;margin:0 16px 8px;display:flex;flex-direction:column;gap:4px}
.nprog-bar{height:6px;background:var(--c2);border-radius:300px;overflow:hidden}
.nprog-bar>i{display:block;height:100%;background:var(--al);border-radius:300px;transition:width .4s}
.nprog-info{display:flex;justify-content:space-between;font-size:12px}
.nprog-info span:first-child{color:var(--al)}.nprog-info span:last-child{color:var(--t)}
.ncards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.ncard{display:flex;align-items:center;gap:10px;background:var(--card);border:none;border-radius:var(--rad);padding:8px 16px;height:84px;cursor:pointer;text-align:left;transition:background .15s}
.ncard:active{background:#202020}
.ncard img{width:52px;height:42px;object-fit:contain;flex-shrink:0}
.ncard b{font-size:16px;font-weight:400;color:var(--t)}
.nimport{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:none;border-radius:var(--rad);padding:18px;cursor:pointer;color:var(--t);font-size:16px;font-weight:400}
.nimport img{width:26px;height:26px;object-fit:contain}
/* config screen header (open from home card) */
.cfg-hdr{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.cfg-hdr-back{background:var(--card);border:1px solid var(--stroke);color:var(--t);font-size:20px;cursor:pointer;width:40px;height:40px;border-radius:var(--rad);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cfg-hdr-title{font-size:22px;font-weight:700}

/* ─── Config card (redesign: #1d1d1d, крупные чипы h50, обводки) ─── */
.cfg-card{background:#1d1d1d;border-radius:var(--rad);padding:8px;margin:0 16px 8px}
.cfg-lbl{font-size:12px;color:var(--al);margin-bottom:8px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip{padding:8px 16px;height:50px;border-radius:8px;border:1px solid var(--stroke);font-size:16px;cursor:pointer;background:#1d1d1d;color:var(--t);transition:all .15s;font-weight:400;display:flex;align-items:center;justify-content:center;flex:1 1 120px;min-width:0}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
/* side-by-side config (filter + count) */
.cfg-row{display:flex;gap:8px;padding:0 16px 8px}
.cfg-row .cfg-card{flex:1;margin:0}

/* ─── Start button (full-width, крупная) ─── */
.start-row{padding:8px 16px 0}
.start-btn{width:100%;height:60px;background:var(--a);border:none;color:#fff;border-radius:var(--rad);font-size:22px;cursor:pointer;transition:opacity .15s}
.start-btn:active{opacity:.8}

/* ─── Full-width button ─── */
.btn{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:300px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;width:100%}
.btn:active{opacity:.75}
.btn-p{background:var(--a);color:#fff}
.btn-s{background:var(--c);color:var(--t)}
.btn-d{background:rgba(255,60,60,.15);color:var(--r)}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn{flex:1}

/* ─── Flashcard ─── */
.fc-counter{font-size:18px;text-align:center;padding:8px 16px 12px}
.fc-wrap{perspective:1000px;min-height:260px;margin:0 16px 14px;cursor:pointer}
.fc{width:100%;display:grid;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;background:var(--c);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:260px}
.fc-back{transform:rotateY(180deg);background:var(--c2)}
.fc-sbar{position:absolute;top:0;left:0;right:0;height:4px;border-radius:16px 16px 0 0}
.fc-sbar.g{background:var(--g)}.fc-sbar.y{background:var(--y)}.fc-sbar.r{background:var(--c2)}
/* Kanji card face */
.fc-kanji{font-size:76px;font-weight:400;color:var(--a);line-height:1}
.fc-kana{font-size:36px;font-weight:400;color:var(--a);line-height:1;margin-top:4px}
.fc-meanings{margin-top:12px;text-align:center}
.fc-mn{font-size:12px;color:var(--t);line-height:1.6}
.fc-tap{font-size:12px;color:var(--t2);margin-top:12px}
/* Word card face (non-kanji) */
.fc-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);margin-bottom:8px}
.fc-main{font-size:60px;line-height:1;color:var(--t);text-align:center}
.fc-main.sm{font-size:22px}
/* Back side rows */
.fc-back-body{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
/* On/kun label (legacy, kept for compat) */
.fc-onkun{display:flex;flex-direction:column;gap:4px;align-items:center;margin-top:6px}
.fc-okrow{font-size:12px;color:var(--t)}
.fc-okrow span{color:var(--a);font-size:16px;margin-left:4px}

/* ─── Card Variant System (Figma 31:112 / 33:235) ─── */
.cv-root{width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}
.cv-top{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.cv-main{font-size:52px;line-height:1;color:var(--t);font-weight:400}
.cv-readings{display:flex;flex-direction:column;gap:12px}
.cv-rread{display:flex;flex-direction:column;gap:2px}
.cv-rl{font-size:12px;color:var(--t);line-height:1.2}
.cv-rv{font-size:20px;color:var(--a);line-height:1.2;word-break:break-word}
.cv-kana-lg{font-size:36px;color:var(--a);line-height:1}
.cv-meanings{width:280px;max-width:100%;display:flex;flex-direction:column;gap:4px}
.cv-mn{display:flex;flex-direction:row;align-items:baseline;gap:6px}
.cv-mi{font-size:12px;color:var(--t);line-height:1.2;flex-shrink:0}
.cv-mt{font-size:16px;color:var(--t);line-height:1.3;word-break:break-word}

/* ─── Mark buttons ─── */
.mark-row{display:flex;gap:8px;padding:0 16px;margin-bottom:8px}
.mbtn{flex:1;height:36px;border-radius:300px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;transition:opacity .15s}
.mbtn:active{opacity:.7}
.mbtn.r{background:rgba(255,60,60,.15);color:var(--r)}
.mbtn.y{background:rgba(255,242,133,.15);color:var(--y)}
.mbtn.g{background:rgba(122,255,120,.15);color:var(--g)}

/* ─── Stop/Skip row ─── */
.stop-row{display:flex;gap:8px;padding:0 16px}
.stop-btn{flex:1;height:27px;background:var(--c);border:none;color:var(--t);border-radius:16px;font-size:12px;cursor:pointer;transition:opacity .15s}
.stop-btn:active{opacity:.7}

/* ─── Quiz score badges (Figma: pill 100×20, border) ─── */
.qscore{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 16px;margin-bottom:12px;flex-wrap:wrap}
.qbadge{display:flex;align-items:center;justify-content:center;gap:10px;min-width:100px;height:20px;padding:6px 8px;border-radius:16px;border:1px solid var(--a);font-size:12px;color:var(--t);background:transparent;line-height:1}
.qbadge.qbad{border-color:#ff4f4f}
.qbadge.qok{border-color:#7aff78}

/* ─── Quiz question card (Figma: h280, p16, gap20) ─── */
.quiz-q{background:var(--c);border-radius:16px;padding:16px;margin:0 16px 12px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.quiz-ql{font-size:12px;color:var(--al)}
.quiz-qm{font-size:52px;line-height:1}
.quiz-qm.sm{font-size:20px}
.quiz-qh{font-size:14px;color:var(--t2)}

/* ─── Quiz options panel (Figma: card wrap + label) ─── */
.quiz-panel{background:var(--c);border-radius:16px;padding:8px;margin:0 16px 12px;display:flex;flex-direction:column;gap:16px;align-items:center}
.quiz-panel-lbl{font-size:12px;color:var(--al);text-align:center}
.quiz-opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px;width:100%}
.qopt{background:var(--c);border:1px solid var(--a);color:var(--t);border-radius:4px;padding:8px 6px;font-size:16px;cursor:pointer;text-align:center;line-height:1.3;overflow-wrap:anywhere;min-width:0;min-height:54px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:0 2px;transition:background .15s,border-color .15s}
.qopt.sel{background:var(--a);color:#fff}
.qopt.ok{background:rgba(122,255,120,.18);border-color:var(--g);color:var(--g)}
.qopt.bad{background:rgba(255,60,60,.18);border-color:var(--r);color:var(--r)}
.qopt:disabled{cursor:default}

/* ─── Quiz input (Figma: pill, border, 12px) ─── */
.quiz-inp{width:100%;background:transparent;border:1px solid var(--a);border-radius:300px;color:var(--t);font-size:13px;padding:6px 12px;outline:none;font-family:inherit;text-align:center;transition:border-color .15s,box-shadow .15s}
.quiz-inp::placeholder{color:#5a5a5a}
.quiz-inp:focus{box-shadow:0 0 0 2px rgba(63,111,207,.4)}
.quiz-inp.ok{border-color:var(--g);color:var(--g)}
.quiz-inp.bad{border-color:var(--r);color:var(--r)}
.quiz-inp:disabled{opacity:.9;cursor:default}
.quiz-result{font-size:13px;text-align:center}
.quiz-result.ok{color:var(--g)}
.quiz-result.bad{color:var(--r)}

/* ─── Quiz bottom actions (Стоп / Пропустить) ─── */
.quiz-actions{display:flex;gap:4px;justify-content:center;padding:0 16px;margin-bottom:10px}
.qact-btn{min-width:100px;height:27px;padding:6px 8px;background:var(--c);border:1px solid var(--a);color:var(--t);border-radius:16px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.qact-btn:active{opacity:.7}

/* ─── Next button (quiz) ─── */
.next-btn{margin:0 16px 10px;background:var(--a);border:none;color:#fff;border-radius:16px;padding:10px;font-size:13px;font-weight:500;width:calc(100% - 32px);cursor:pointer;transition:opacity .15s}
.next-btn:active{opacity:.8}

/* ─── Big kanji option (compose / pairs) ─── */
.qopt.kanji{font-size:24px;font-weight:400;min-height:47px}
.qopt.kanji .qopt-on{font-size:11px;color:var(--a);margin-left:5px}
/* Card border feedback (canvas result) */
.quiz-q.ok{border:2px solid var(--g)}
.quiz-q.bad{border:2px solid var(--r)}

/* ─── Kanji hints (Figma: Подсказка_квиз_кандзи) ─── */
.hint-btn{display:flex;align-items:center;justify-content:center;width:calc(100% - 32px);margin:0 16px 12px;height:47px;background:var(--c);border:1px solid var(--a);color:var(--t);border-radius:16px;font-size:14px;cursor:pointer;transition:opacity .15s}
.hint-btn.on{background:var(--a);color:#fff}
.hint-btn:active{opacity:.7}
.hint-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 16px 12px}
.hint-chip{flex:1 1 calc(50% - 4px);min-width:0;min-height:47px;background:var(--c);border:1px solid var(--a);border-radius:16px;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.hint-word{font-size:18px;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint-read{font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.hint-read b{color:var(--a);font-weight:400}
.hint-empty{flex:1 1 100%;text-align:center;font-size:12px;color:var(--t2);padding:8px}

/* ─── Compose word mode (Figma: Составить слова) ─── */
.cmp-canvas{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.cmp-build{display:flex;gap:8px;justify-content:center;align-items:center;min-height:66px;flex-wrap:wrap}
.cmp-ch{font-size:56px;line-height:1;color:var(--t)}
.cmp-slot{width:44px;height:60px;border-bottom:2px solid var(--c2);display:inline-block}
.cmp-line{font-size:14px;color:var(--t);text-align:center}
.cmp-line .lbl{color:var(--t)}
.cmp-line .val{color:var(--a)}
.cmp-correct{font-size:15px;color:var(--g);text-align:center}
.cmp-correct span{font-size:22px;color:var(--g);margin-left:4px}
.cmp-switch{display:flex;gap:8px;margin:0 16px 12px}
.cmp-sw{flex:1;height:47px;border:1px solid var(--a);background:var(--c);color:var(--t);border-radius:16px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.cmp-sw.on{background:var(--a);color:#fff}
.cmp-sw:active{opacity:.8}
.cmp-arrow{font-size:15px;line-height:1}
/* reverse: кандзи-слово как подсказка, собираем кану */
.cmp-word{font-size:48px;line-height:1;color:var(--t);text-align:center}
.cmp-kana{font-size:30px;line-height:1;color:var(--t)}
/* финал: фуригана (чтение над иероглифом) */
.furi{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.furi ruby{font-size:52px;line-height:1;color:var(--t);ruby-position:over;-webkit-ruby-position:before}
.furi rt{font-size:15px;color:var(--a);line-height:1.3;text-align:center}

/* ─── Choose pair mode (Figma: Выбери пару) ─── */
.pair-count{display:flex;justify-content:center;margin:0 16px 12px}
.pair-count-pill{min-width:47px;height:24px;padding:2px 16px;border-radius:16px;background:var(--a);color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center}
.pair-canvas{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.pair-slots{display:flex;justify-content:center;align-items:flex-start;gap:52px}
.pair-slot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:80px}
.pair-slot .pk{font-size:52px;line-height:1;color:var(--t)}
.pair-slot .pm{font-size:12px;color:var(--t)}
.pair-slot .pm b{color:var(--a);font-weight:400}
.pair-on{font-size:12px;color:var(--t);text-align:center;line-height:1.4}
.pair-on .lbl{color:var(--t)}
.pair-on .val{color:var(--a);font-size:20px}
.pair-hint{font-size:13px;color:var(--t2);text-align:center;padding:0 20px;line-height:1.5}

/* ─── Words list ─── */
.wfilter{display:flex;gap:6px;padding:0 16px 10px;align-items:center}
.wf-tab{padding:9px 20px;border-radius:var(--rad);border:1px solid var(--stroke);font-size:15px;background:var(--card);color:var(--t);cursor:pointer}
.wf-tab.on{background:var(--a);border-color:var(--a);color:#fff}
.wf-import{padding:8px 12px;border-radius:var(--rad);border:1px solid var(--stroke);font-size:13px;background:var(--card);color:var(--t);cursor:pointer;display:flex;align-items:center;gap:5px;margin-left:auto}
.wf-search{padding:8px 12px;border-radius:var(--rad);border:1px solid var(--stroke);font-size:13px;background:var(--card);color:var(--t);cursor:pointer;display:flex;align-items:center;gap:5px}
.wsearch-wrap{padding:0 16px 10px;position:relative}
.wsearch{width:100%;background:var(--card);border:1px solid var(--stroke);border-radius:var(--rad);color:var(--t);font-size:14px;padding:10px 16px 10px 36px;outline:none;font-family:inherit}
.wsearch::placeholder{color:var(--t2)}
.wsearch-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
/* ─── Словарь (редизайн: поиск + карточки с обводкой + фуригана) ─── */
.dsearch{position:relative;margin:0 16px 10px}
.dsearch-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;object-fit:contain;pointer-events:none}
.dsearch-inp{width:100%;height:50px;background:#1d1d1d;border:1px solid var(--stroke);border-radius:var(--rad);color:var(--t);font-size:16px;padding:0 16px 0 44px;outline:none;font-family:inherit}
.dsearch-inp::placeholder{color:var(--t2)}
.dlist{padding:0 16px;display:flex;flex-direction:column;gap:4px}
.ditem{display:flex;align-items:center;gap:12px;background:#1d1d1d;border:1px solid var(--a);border-radius:var(--rad);padding:7px 12px}
.ditem-k{font-size:24px;color:var(--t);line-height:1.1;flex-shrink:0;min-width:40px}
.ditem-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ditem-r{font-size:12px;color:var(--al);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem-m{font-size:13px;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem-st{flex-shrink:0;width:18px;display:flex;align-items:center;justify-content:center}
.ditem-st .dot{width:9px;height:9px;border-radius:50%;background:var(--c2)}
.ditem-st.learning .dot{background:var(--y)}
.dfolder{font-size:11px;color:var(--al);margin-top:1px}
.wlist{background:var(--card);border-radius:var(--rad);margin:0 16px 10px;overflow:hidden}
.witem{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05);gap:12px}
.witem:last-child{border-bottom:none}
.wkanji{font-size:24px;min-width:40px;text-align:center}
.winfo{flex:1;min-width:0}
.wreading{font-size:12px;color:var(--al)}
.wtrans{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdot{width:9px;height:9px;border-radius:50%;background:var(--c2);flex-shrink:0}
.wdot.g{background:var(--g)}.wdot.y{background:var(--y)}.wdot.r{background:var(--r)}
.wok{font-size:11px;color:var(--al)}

/* ─── Settings ─── */
.sset{background:var(--card);border-radius:var(--rad);overflow:hidden;margin:0 16px 12px}
.sset-lbl{font-size:12px;color:var(--al);padding:0 16px;margin-bottom:6px}
.srow{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.srow:last-child{border-bottom:none}
.srow-l{flex:1;font-size:14px}
.srow-r{font-size:13px;color:var(--al)}
.confirm-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.05);gap:8px}
.confirm-row:last-child{border-bottom:none}
.confirm-text{flex:1;font-size:13px}
.confirm-no,.confirm-yes{border:none;border-radius:300px;padding:6px 16px;font-size:12px;cursor:pointer}
.confirm-no{background:var(--c2);color:var(--t)}
.confirm-yes{background:rgba(255,60,60,.15);color:var(--r)}

/* ─── Import ─── */
.dropzone{border:2px dashed var(--c2);border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin:0 16px 10px}
.dropzone.over{border-color:var(--a);background:rgba(63,111,207,.07)}
.dz-icon{font-size:36px;margin-bottom:8px}
.dz-text{font-size:14px;font-weight:500;color:var(--t)}
.dz-hint{font-size:12px;color:var(--t2);margin-top:4px}
.tbl-wrap{overflow-x:auto;border-radius:12px;overflow:hidden;margin:0 16px 10px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--c)}
th{background:var(--c2);padding:8px 10px;text-align:left;font-weight:600;color:var(--al);font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid rgba(255,255,255,.05);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}

/* ─── Empty ─── */
.empty{text-align:center;padding:60px 20px;color:var(--t2)}
.ei{font-size:56px;margin-bottom:14px}
.et{font-size:18px;font-weight:700;color:var(--t);margin-bottom:6px}
.eb{font-size:13px;margin-bottom:20px}

/* ─── Done ─── */
.done{text-align:center;padding:40px 16px}
.done-i{font-size:56px;margin-bottom:12px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.rc{border-radius:16px;padding:14px;text-align:center}
.rc.g{background:rgba(122,255,120,.12);color:var(--g)}
.rc.y{background:rgba(255,242,133,.12);color:var(--y)}
.rc.r{background:rgba(255,60,60,.12);color:var(--r)}
.rn{font-size:32px;font-weight:700}.rl{font-size:12px;margin-top:3px;opacity:.8}

/* ─── Sub-tabs (Карточки / Квиз) ─── */
.sub-tabs{display:flex;background:var(--card);border-radius:var(--rad);padding:4px;gap:4px;margin:0 16px 14px}
.stab{flex:1;padding:8px;border-radius:300px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;background:none;color:var(--t2)}
.stab.on{background:var(--c2);color:var(--t)}

/* ─── Toast ─── */
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-20px);background:transparent;color:var(--t2);font-size:12px;z-index:300;opacity:0;transition:opacity .25s, transform .25s;white-space:nowrap;pointer-events:none;padding:4px 10px;letter-spacing:.2px}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ─── Error box ─── */
.err-box{background:rgba(255,60,60,.1);border:1px solid var(--r);border-radius:12px;padding:11px 14px;color:var(--r);font-size:13px;margin:0 16px 10px}

/* ─── Mono ─── */
.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;color:var(--al);line-height:1.7}
</style>
</head>

function load(){
  try{
    const d=JSON.parse(localStorage.getItem('jl4')||'{}');
    S.words=d.words||[]; S.progress=d.progress||{};
    S.kanjiItems=d.kanjiItems||[]; S.kanjiProgress=d.kanjiProgress||{};
    S.wordsCsv=d.wordsCsv||''; S.kanjiCsv=d.kanjiCsv||'';
    S.studyCfg={...S.studyCfg,...(d.studyCfg||{})};
    S.quizCfg={...S.quizCfg,...(d.quizCfg||{})};
    if(typeof S.quizCfg.question==='string')S.quizCfg.question=[S.quizCfg.question];
    if(typeof S.studyCfg.front==='string')S.studyCfg.front=[S.studyCfg.front];
    // answer стал мультивыбором: строка → массив
    if(typeof S.quizCfg.answer==='string')S.quizCfg.answer=[S.quizCfg.answer];
    if(!Array.isArray(S.quizCfg.answer)||!S.quizCfg.answer.length)S.quizCfg.answer=[S.quizCfg.type==='kanji'?'on_reading':'reading'];
    // «Все три» больше не режим — если сохранён, приводим к обычному
    if(S.quizCfg.mode==='match')S.quizCfg.mode='choice6';
    if(!Array.isArray(S.studyCfg.folders))S.studyCfg.folders=[];
    if(!Array.isArray(S.quizCfg.folders))S.quizCfg.folders=[];
    if(!S.quizCfg.composeShow||typeof S.quizCfg.composeShow!=='object')S.quizCfg.composeShow={reading:true,meaning:false};
    if(typeof S.quizCfg.composeReverse==='boolean'){S.quizCfg.composeMode=S.quizCfg.composeReverse?'reverse':'normal';delete S.quizCfg.composeReverse;}
    if(!['normal','reverse','ultra'].includes(S.quizCfg.composeMode))S.quizCfg.composeMode='normal';
    if(!['all','easy','medium','hard'].includes(S.quizCfg.ultraDifficulty))S.quizCfg.ultraDifficulty='all';
    if(d.wordDisplay==='kana'||d.wordDisplay==='full')S.wordDisplay=d.wordDisplay;
    if(typeof d.hintsEnabled==='boolean')S.hintsEnabled=d.hintsEnabled;
    // Папки: старые записи без папки → «Общая»
    S.words.forEach(w=>{if(!w.folder)w.folder='Общая';});
    S.kanjiItems.forEach(w=>{if(!w.folder)w.folder='Общая';});
    // Миграция on/kun: пересплитим безусловно — splitOnKun идемпотентен.
    // Раньше проверка пропускала случаи, когда импорт сложил всё в одно поле
    // (одна азбука), и второе оставалось пустым → на фронте дашы. В TG-вебвью
    // localStorage отдельный, и старые данные не правились.
    let migrated=false;
    S.kanjiItems.forEach(w=>{
      const combined=[w.reading,w.on_reading,w.kun_reading].filter(Boolean).join('・');
      if(!combined)return;
      const{on_reading,kun_reading}=splitOnKun(combined);
      const newOn=on_reading||'',newKun=kun_reading||'';
      if(newOn!==(w.on_reading||'')||newKun!==(w.kun_reading||'')||w.reading){
        w.on_reading=newOn;
        w.kun_reading=newKun;
        delete w.reading;
        migrated=true;
      }
    });
    if(migrated)save();
  }catch{}
}
function save(){
  try{
    localStorage.setItem('jl4',JSON.stringify({
      words:S.words,progress:S.progress,
      kanjiItems:S.kanjiItems,kanjiProgress:S.kanjiProgress,
      wordsCsv:S.wordsCsv,kanjiCsv:S.kanjiCsv,
      studyCfg:S.studyCfg,quizCfg:S.quizCfg,wordDisplay:S.wordDisplay,hintsEnabled:S.hintsEnabled,
    }));
  }catch{}
}

/* ── CSV parser ── */
const ALIAS={
  слово:'kanji',word:'kanji',кандзи:'kanji',kanji:'kanji',
  чтение:'reading',кана:'reading',reading:'reading',kana:'reading',
  'он':'on_reading','он-чтение':'on_reading',on:'on_reading',on_reading:'on_reading',onyomi:'on_reading',
  'кун':'kun_reading','кун-чтение':'kun_reading',kun:'kun_reading',kun_reading:'kun_reading',kunyomi:'kun_reading',
  значение:'meaning',meaning:'meaning',english:'meaning',eng:'meaning',
  перевод:'translation',translation:'translation',russian:'translation',rus:'translation',
  заметки:'notes',notes:'notes',note:'notes',
};
function parseLine(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}
    else if(c===sep&&!q){out.push(cur.trim());cur='';}
    else cur+=c;
  }
  out.push(cur.trim());return out;
}
function detectSep(text){
  const row=text.split('\n')[0];
  const t=(row.match(/\t/g)||[]).length;
  // TAB имеет приоритет: табы никогда не встречаются внутри ячеек
  if(t>0)return'\t';
  const c=(row.match(/,/g)||[]).length,s=(row.match(/;/g)||[]).length;
  if(s>c)return';';return',';
}
function parseFile(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const sep=detectSep(text);
  const rows=text.split(/\r?\n/).filter(l=>l.trim());
  if(rows.length<1)throw new Error('Файл пустой');
  const first=parseLine(rows[0],sep);
  const hasH=first.some(h=>{const k=h.toLowerCase().replace(/[\s\-]/g,'_');return!!(ALIAS[k]||ALIAS[h.toLowerCase()]);});
  if(!hasH){const rawRows=rows.map(r=>parseLine(r,sep));return{rawRows,colCount:first.length,hasHeaders:false};}
  const headers=first.map(h=>{const k=h.toLowerCase().replace(/[\s\-]/g,'_');return ALIAS[k]||ALIAS[h.toLowerCase()]||k;});
  const rawRows=rows.slice(1).map(r=>parseLine(r,sep));
  return{...applyMapping(rawRows,headers,S.importType==='kanji'),hasHeaders:true};
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
/* ── Katakana / Hiragana sets (explicit, from user spec) ── */
const KATA_SET=new Set([...'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヰヱヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポァィゥェォッャュョヴ']);
const HIRA_SET=new Set([...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわゐゑをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゔ']);
// ー (U+30FC) — нейтральный знак: определяем по предыдущему токену
function isHira(s){return[...s].some(c=>HIRA_SET.has(c));}
function isKata(s){return[...s].some(c=>KATA_SET.has(c));}
function splitOnKun(str){
  // Разбиваем по запятой, японской запятой, средней точке (・) и пробелам
  const parts=str.split(/[,、・\s]+/).filter(Boolean);
  const on=[],kun=[];
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    // Убираем ー и прочие нейтральные знаки для классификации
    const s=p.replace(/[ーー・～\u30FC\u30FE]/g,'');
    if(!s){
      // Токен состоит только из нейтральных знаков (напр. "ー")
      // Определяем по предыдущему классифицированному токену
      if(kun.length>0&&on.length===0)kun.push(p);
      else on.push(p);
      continue;
    }
    const hasKana=[...s].some(c=>HIRA_SET.has(c)||KATA_SET.has(c));
    if(!hasKana)continue; // не-кана (английский, цифры) — это не чтение, дропаем
    if(isKata(s)&&!isHira(s))on.push(p);
    else if(isHira(s)&&!isKata(s))kun.push(p);
    else on.push(p); // смешанный (кана+кана) → он
  }
  return{on_reading:on.join('・'),kun_reading:kun.join('・')};
}
function applyMapping(rawRows,mapping,isKanji=false){
  const words=[];
  for(const vals of rawRows){
    if(vals.every(v=>!v))continue;
    const w={id:uid()};
    mapping.forEach((fk,j)=>{if(fk)w[fk]=(vals[j]||'').trim();});
    if(isKanji){
      // Сплит on/kun: объединяем reading + on_reading + kun_reading и переразбиваем
      // по алфавиту (катакана → on, хирагана → kun). Идемпотентно для корректных данных.
      const hasLegacy=!!w.reading;
      const onBroken=w.on_reading&&isHira(w.on_reading);
      const kunBroken=w.kun_reading&&isKata(w.kun_reading);
      if(hasLegacy||onBroken||kunBroken){
        const combined=[w.reading,w.on_reading,w.kun_reading].filter(Boolean).join('・');
        const{on_reading,kun_reading}=splitOnKun(combined);
        w.on_reading=on_reading||'';
        w.kun_reading=kun_reading||'';
        delete w.reading;
      }
    }
    if(!w.kanji&&w.reading)w.kanji=w.reading.split(',')[0].trim();
    if(w.kanji)words.push(w);
  }
  if(!words.length)throw new Error('Нет записей с полем кандзи');
  // foundFields берём из реальных данных, а не из маппинга
  // (после сплита reading → on_reading+kun_reading маппинг уже не актуален)
  const flds=isKanji?KF:WF;
  const foundFields=flds.filter(f=>words.some(w=>w[f]));
  return{words,headers:foundFields,hasHeaders:true};
}
function defaultMapping(colCount,isKanji=false){
  let d;
  if(isKanji){
    // 3 кол.: kanji / смешанные он+кун / значение  → reading автосплитнется на он/кун
    // 4+ кол.: kanji / он / кун / значение / ...
    // 3 кол.: kanji / смешанные он+кун (мапим в on_reading, потом applyMapping
    //          увидит хирагану в on_reading и автосплитнет на он/кун) / значение
    // 4+ кол.: kanji / он / кун / значение / ...
    d=colCount<=3
      ?['kanji','on_reading','meaning']
      :['kanji','on_reading','kun_reading','meaning','translation','notes'];
  }else{
    d=['kanji','reading','meaning','translation','notes'];
  }
  return Array.from({length:colCount},(_,i)=>d[i]||'');
}

/* ── SM-2 lite ──
 * Per-item progress object:
 *   {reps, lapses, ef, interval, due, lastSeen}
 * Status is derived from reps/interval, not stored, чтобы не рассинхронизировать.
 * quality 0..5 (как в классическом SM-2): <3 — провал; ≥3 — успех.
 *   choice correct  → 4
 *   input  correct  → 5
 *   any    wrong    → 1
 *   mark "знаю"     → 5
 *   mark "учу"      → 3
 *   mark "не знаю"  → 0
 */
const SM={DAY:86400000,KNOW_REPS:3,KNOW_INTERVAL:7,DEFAULT_EF:2.5,MIN_EF:1.3};
function defaultProg(){return{reps:0,lapses:0,ef:SM.DEFAULT_EF,interval:0,due:0,lastSeen:0};}
function getProg(p,id){
  const v=p[id];
  if(!v)return defaultProg();
  if(typeof v==='string'){
    // Legacy migration: status string → object с разумными значениями
    const e=defaultProg();
    if(v==='know'){e.reps=SM.KNOW_REPS;e.interval=SM.KNOW_INTERVAL;e.due=Date.now()+SM.KNOW_INTERVAL*SM.DAY;}
    else if(v==='learning'){e.reps=1;e.lapses=1;e.interval=1;e.due=Date.now()+SM.DAY;}
    return e;
  }
  return{...defaultProg(),...v};
}
function statusOf(p,id){
  const v=p[id];
  if(!v)return'unknown';
  if(typeof v==='string')return v;
  const reps=v.reps||0,lapses=v.lapses||0,interval=v.interval||0;
  if(reps===0&&lapses===0)return'unknown';
  if(reps>=SM.KNOW_REPS&&interval>=SM.KNOW_INTERVAL)return'know';
  return'learning';
}
function smUpdate(p,id,quality){
  const e=getProg(p,id);
  if(quality<3){
    e.reps=0;e.interval=1;e.lapses=(e.lapses||0)+1;
  } else {
    if(e.reps===0)e.interval=1;
    else if(e.reps===1)e.interval=6;
    else e.interval=Math.max(1,Math.round(e.interval*(e.ef||SM.DEFAULT_EF)));
    e.reps=(e.reps||0)+1;
  }
  const ef=(e.ef||SM.DEFAULT_EF)+(0.1-(5-quality)*(0.08+(5-quality)*0.02));
  e.ef=Math.max(SM.MIN_EF,ef);
  e.lastSeen=Date.now();
  e.due=Date.now()+e.interval*SM.DAY;
  p[id]=e;
}
function smOverwrite(p,id,quality){
  // Кнопки в флэшкарте: явный overwrite от пользователя (без накопления reps)
  if(quality>=5){p[id]={reps:SM.KNOW_REPS,lapses:0,ef:SM.DEFAULT_EF,interval:SM.KNOW_INTERVAL,due:Date.now()+SM.KNOW_INTERVAL*SM.DAY,lastSeen:Date.now()};}
  else if(quality>=3){p[id]={reps:1,lapses:0,ef:SM.DEFAULT_EF,interval:1,due:Date.now()+SM.DAY,lastSeen:Date.now()};}
  else {p[id]={reps:0,lapses:1,ef:SM.DEFAULT_EF,interval:0,due:Date.now(),lastSeen:Date.now()};}
}
function dueOf(p,id){const v=p[id];if(!v||typeof v==='string')return 0;return v.due||0;}

/* ── Data helpers ── */
function ds(type){return type==='kanji'?S.kanjiItems:S.words;}
function pr(type){return type==='kanji'?S.kanjiProgress:S.progress;}
/* ── Папки ── */
function foldersOf(type){
  const set=new Set(['Общая']);
  ds(type).forEach(w=>set.add(w.folder||'Общая'));
  return[...set];
}
function allFolders(){
  const set=new Set(['Общая']);
  S.words.forEach(w=>set.add(w.folder||'Общая'));
  S.kanjiItems.forEach(w=>set.add(w.folder||'Общая'));
  return[...set];
}
/* ── Ключ дедупликации: слово + чтение ── */
function normKey(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,'');}
function itemKey(w,type){
  return type==='kanji'
    ?normKey(w.kanji)+'␀'+normKey(w.on_reading)+'␀'+normKey(w.kun_reading)
    :normKey(w.kanji)+'␀'+normKey(w.reading);
}
function importTargetFolder(){return(S.importNewFolder?(S.importNewName||'').trim():S.importFolder)||'Общая';}
function filtered(type,filter,count,folders){
  const p=pr(type);
  let arr=[...ds(type)];
  if(folders&&folders.length)arr=arr.filter(w=>folders.includes(w.folder||'Общая'));
  if(filter!=='all')arr=arr.filter(w=>statusOf(p,w.id)===filter);
  // SM-2: для лимита берём сначала просроченные (due<=now), затем добиваем случайными
  if(count&&count!=='all'){
    const n=parseInt(count),now=Date.now();
    const due=shuffle(arr.filter(w=>dueOf(p,w.id)<=now));
    const rest=shuffle(arr.filter(w=>dueOf(p,w.id)>now));
    arr=[...due,...rest].slice(0,n);
  }
  return arr;
}
function shuffle(arr){return[...arr].sort(()=>Math.random()-.5);}
function buildStudyQueue(){
  // Карточки: просроченные первыми, далее по lastSeen (давно не виденные раньше)
  const arr=filtered(S.studyCfg.type,S.studyCfg.filter,S.studyCfg.count,S.studyCfg.folders);
  const p=pr(S.studyCfg.type),now=Date.now();
  return arr.sort((a,b)=>{
    const da=dueOf(p,a.id),db=dueOf(p,b.id);
    const aDue=da<=now,bDue=db<=now;
    if(aDue!==bDue)return aDue?-1:1;
    return da-db;
  });
}
function arr(x){return Array.isArray(x)?x:(x==null?[]:[x]);}
// Отображение слова: 'kana' → показываем чтение вместо кандзи-формы (только для слов)
function wordGlyph(w,type){
  if(type==='words'&&S.wordDisplay==='kana'&&w.reading)return w.reading;
  return w.kanji;
}
/* ── #2 Меньше повторов + больше рандома ──
 * Исключаем недавно показанные, дальше — просроченные вперёд, внутри тира случайно. */
function rankPool(pool,type){
  const now=Date.now(),pp=pr(type),rec=S.quizRecent||[];
  let cand=pool.filter(w=>!rec.includes(w.id));
  if(!cand.length)cand=pool.slice(); // все недавно были — берём всех
  const dueP=shuffle(cand.filter(w=>dueOf(pp,w.id)<=now));
  const restP=shuffle(cand.filter(w=>dueOf(pp,w.id)>now));
  return[...dueP,...restP];
}
function noteRecent(id,poolSize){
  if(!id)return;
  S.quizRecent=S.quizRecent||[];
  S.quizRecent.push(id);
  const cap=Math.max(1,Math.min(15,(poolSize||1)-1));
  while(S.quizRecent.length>cap)S.quizRecent.shift();
}

function buildQuizQ(){
  const{type,mode,filter,count}=S.quizCfg;
  const af=arr(S.quizCfg.answer)[0];
  const qFields=arr(S.quizCfg.question);
  const optN=(mode==='choice4'?4:6);
  const pool=filtered(type,filter,count,S.quizCfg.folders).filter(w=>w[af]&&qFields.some(f=>w[f]));
  if(pool.length<2)return null;
  const all=ds(type).filter(w=>w[af]);
  if(all.length<optN)return null;
  const qw=rankPool(pool,type)[0];
  if(!qw)return null;
  noteRecent(qw.id,pool.length);
  // Wrongs must be unique and != correct
  const correctVal=qw[af];
  const wrongPool=[];
  const seen=new Set([correctVal]);
  for(const w of shuffle(all)){
    if(w.id===qw.id)continue;
    if(seen.has(w[af]))continue;
    seen.add(w[af]);
    wrongPool.push(w[af]);
    if(wrongPool.length>=optN-1)break;
  }
  if(wrongPool.length<optN-1)return null;
  const options=shuffle([correctVal,...wrongPool]);
  const mixInput=mode==='mix'?Math.random()<0.5:null;
  return{word:qw,qFields,aField:af,options,correct:options.indexOf(correctVal),mixInput};
}
/* ── #3 Мультиполевой квиз ──
 * «Что отгадываем» — мультивыбор. На каждое выбранное поле своя группа
 * вариантов (или поле ввода). Заменяет прежний режим «Все три». */
function buildMultiQ(){
  const{type,mode,filter,count}=S.quizCfg;
  const qFields=arr(S.quizCfg.question);
  const aFields=arr(S.quizCfg.answer).filter(Boolean);
  const optN=mode==='choice4'?4:6;
  const all=ds(type);
  const pool=filtered(type,filter,count,S.quizCfg.folders)
    .filter(w=>qFields.some(f=>w[f])&&aFields.some(f=>w[f]));
  if(pool.length<2)return null;
  const qw=rankPool(pool,type)[0];
  if(!qw)return null;
  noteRecent(qw.id,pool.length);
  const useInput=mode==='input'||(mode==='mix'&&Math.random()<0.5);
  const groups=[];
  for(const f of aFields){
    const correct=qw[f];if(!correct)continue;
    let options=null,correctIdx=-1;
    if(!useInput){
      const seen=new Set([correct]);const distract=[];
      for(const w of shuffle(all)){
        if(w.id===qw.id||!w[f]||seen.has(w[f]))continue;
        seen.add(w[f]);distract.push(w[f]);
        if(distract.length>=optN-1)break;
      }
      options=shuffle([correct,...distract]);
      correctIdx=options.indexOf(correct);
    }
    groups.push({field:f,correct,options,correctIdx});
  }
  if(!groups.length)return null;
  return{multi:true,word:qw,qFields,aFields,mode,useInput,groups,picks:{},inputs:{}};
}
/* ── Compose mode (Figma: Составить слова) ──
 * Слово из 2–3 кандзи собирается из 6 иероглифов. */
function isKanjiChar(c){const n=c.codePointAt(0);return(n>=0x4e00&&n<=0x9fff)||(n>=0x3400&&n<=0x4dbf)||(n>=0xf900&&n<=0xfaff);}
function kanjiChars(str){return[...String(str||'')].filter(isKanjiChar);}

/* ── Мэтчинг встроенного банка слов с загруженным словарём кандзи ── */
function userKanjiSet(){
  const s=new Set();
  S.kanjiItems.forEach(k=>{const c=String(k.kanji||'');if([...c].length===1)s.add(c);});
  return s;
}
// Слово подходит, если все его кандзи есть в загруженном словаре кандзи
function wordMatchesKanji(word,ks){
  const kc=kanjiChars(word);
  return kc.length>0&&kc.every(c=>ks.has(c));
}
// Пример-слова для иероглифа: только встроенный банк из CSV (по загруженным кандзи)
function exampleWords(ch){
  const ks=userKanjiSet(),out=[],seen=new Set();
  BUILTIN_WORDS.forEach(bw=>{
    if(seen.has(bw.w)||bw.w===ch||![...bw.w].includes(ch))return;
    if(!wordMatchesKanji(bw.w,ks))return;
    seen.add(bw.w);out.push({kanji:bw.w,reading:bw.r});
  });
  return out;
}
// Встроенные слова 2–3 кандзи, все кандзи которых загружены — источник для «Составить слова»
function builtinComposeWords(){
  const ks=userKanjiSet();
  return BUILTIN_WORDS.filter(bw=>{
    const ch=[...bw.w];
    return ch.length>=2&&ch.length<=3&&ch.every(isKanjiChar)&&ch.every(c=>ks.has(c));
  }).map(bw=>({id:'bw_'+bw.w,kanji:bw.w,reading:bw.r,meaning:bw.m,seg:bw.k||null,folder:'Общая',_builtin:true}));
}
// Ultra: слова из additional-банка. Известность считаем ПО ИМПОРТУ юзера:
// в слове должен быть ≥1 незнакомый кандзи (нет в импорте — он «стоит» на месте
// как учимый) и ≥1 знакомый (есть в импорте — его юзер подставляет по значению).
function ultraComposeWords(){
  const ks=userKanjiSet();
  const diff=S.quizCfg.ultraDifficulty||'all';
  return ADDITIONAL_WORDS.filter(w=>{
    if(diff!=='all'&&w.d!==diff)return false;
    const ch=[...w.w];
    if(ch.length<2||ch.length>3||!ch.every(isKanjiChar))return false;
    const unknown=ch.filter(c=>!ks.has(c)).length;
    const known=ch.filter(c=>ks.has(c)).length;
    return unknown>=1&&known>=1;
  }).map(w=>({id:'aw_'+w.w,kanji:w.w,reading:w.r,meaning:w.m,seg:w.k||null,folder:'Общая',_ultra:true}));
}
function buildComposeQ(){
  const{filter,count}=S.quizCfg;
  const mode=S.quizCfg.composeMode||'normal';
  const reverse=mode==='reverse',ultra=mode==='ultra';
  const p=pr('words');
  let matched=ultra?ultraComposeWords():builtinComposeWords();
  // reverse (собрать кану) требует сегментов чтения по кандзи
  if(reverse)matched=matched.filter(w=>w.seg&&w.seg.length>=2);
  let pool=matched;
  if(filter!=='all')pool=pool.filter(w=>statusOf(p,w.id)===filter);
  if(count&&count!=='all')pool=pool.slice(0,parseInt(count));
  if(!pool.length)return null;
  const qw=rankPool(pool,'words')[0];
  if(!qw)return null;
  noteRecent(qw.id,pool.length);
  if(reverse){
    const target=qw.seg.map(s=>s.r);
    const bag=new Set();
    matched.forEach(w=>{if(w.id===qw.id)return;(w.seg||[]).forEach(s=>{if(!target.includes(s.r))bag.add(s.r);});});
    const distract=shuffle([...bag]);
    const need=Math.max(0,6-target.length);
    const options=shuffle([...target,...distract.slice(0,need)]);
    if(options.length<target.length+1)return null;
    return{compose:true,reverse:true,word:qw,target,options,picks:[],result:null};
  }
  if(ultra){
    const ks=userKanjiSet();
    // позиции слова: незнакомые (нет в импорте) — стоят; знакомые — слоты для подстановки
    const positions=[...qw.kanji].map(c=>({c,known:ks.has(c)}));
    const target=positions.filter(pp=>pp.known).map(pp=>pp.c); // знакомые кандзи по порядку — их выбирает юзер
    // дистракторы — только знакомые кандзи (из импорта юзера)
    const bag=new Set([...ks].filter(c=>!target.includes(c)));
    const distract=shuffle([...bag]);
    const need=Math.max(0,6-target.length);
    const options=shuffle([...target,...distract.slice(0,need)]);
    if(!target.length||options.length<target.length+1)return null;
    return{compose:true,ultra:true,word:qw,positions,target,options,picks:[],result:null};
  }
  // normal: собираем всё слово из кандзи
  const target=[...qw.kanji];
  const bag=new Set();
  matched.forEach(w=>{[...w.kanji].forEach(c=>{if(!target.includes(c))bag.add(c);});});
  const distract=shuffle([...bag]);
  const need=Math.max(0,6-target.length);
  const options=shuffle([...target,...distract.slice(0,need)]);
  if(options.length<target.length+1)return null;
  return{compose:true,reverse:false,word:qw,target,options,picks:[],result:null};
}

/* ── Pairs mode (Figma: Выбери пару) ──
 * Пул из пар кандзи с одинаковым он-чтением. */
function onKey(s){
  const t=String(s||'').split(/[、・,\s]+/).filter(Boolean)[0]||'';
  // хирагана → катакана, чтобы группировать одинаково
  return[...t].map(c=>{const cc=c.charCodeAt(0);return(cc>=0x3041&&cc<=0x3096)?String.fromCharCode(cc+0x60):c;}).join('');
}
function buildPairsQ(){
  const{filter,count}=S.quizCfg;
  const pool=filtered('kanji',filter,count,S.quizCfg.folders).filter(w=>w.on_reading&&onKey(w.on_reading));
  const groups={};
  shuffle(pool).forEach(w=>{const k=onKey(w.on_reading);(groups[k]=groups[k]||[]).push(w);});
  let pairs=Object.values(groups).filter(g=>g.length>=2).map(g=>shuffle(g).slice(0,2));
  if(pairs.length<2)return null;
  pairs=shuffle(pairs).slice(0,5);
  const options=[];
  pairs.forEach((g,pi)=>g.forEach(w=>options.push({
    id:w.id,kanji:w.kanji,on:onKey(w.on_reading),onRaw:w.on_reading,
    meaning:(String(w.meaning||'').split(/;/)[0]||'').trim(),pairId:pi,
  })));
  return{pairs:true,options:shuffle(options),total:pairs.length,found:[],firstPick:null,result:null,wrong:0};
}

function nextQuizQ(){
  const m=S.quizCfg.mode;
  if(m==='compose')return buildComposeQ();
  if(m==='pairs')return buildPairsQ();
  if(arr(S.quizCfg.answer).length>1)return buildMultiQ();
  return buildQuizQ();
}
function startQuizError(){
  const m=S.quizCfg.mode;
  if(m==='compose'){
    if(S.quizCfg.composeMode==='ultra')return'Нет слов: нужны кандзи из импорта для известных частей';
    return'Нужны слова из 2–3 кандзи (проверьте фильтр)';
  }
  if(m==='pairs')return'Нужно ≥2 пар кандзи с общим он-чтением';
  return'Недостаточно данных (нужно ≥4 с заполненными полями)';
}
function checkAns(user,correct){
  const n=s=>s.trim().toLowerCase().replace(/\s+/g,' ');
  const u=n(user);if(!u)return false;
  return correct.split(/[,;、。・\n]/).map(v=>n(v)).filter(Boolean).some(v=>v===u);
}
function bestAF(pref){
  const d=ds(S.quizCfg.type),has=f=>d.some(w=>w[f]);
  if(has(pref))return pref;
  for(const f of['reading','meaning','kanji','on_reading','kun_reading'])
    if(f!==pref&&has(f))return f;
  return pref;
}
function sessionEnd(){
  const p=pr(S.studyCfg.type),res={know:0,learning:0,unknown:0};
  S.studyQueue.forEach(w=>{const s=statusOf(p,w.id);res[s]=(res[s]||0)+1;});
  S.studyResults=res;
}

/* ── Card Variant Builder (Figma 31:112 / 33:235) ── */
function renderKun(s){
  if(!s)return'';
  const tokens=String(s).split(/[、・,]/).map(t=>t.trim()).filter(Boolean);
  return tokens.map(t=>{
    const i=t.indexOf('.');
    const inner=i<0?esc(t):esc(t.slice(0,i))+`<span style="color:#636363">${esc(t.slice(i+1))}</span>`;
    return`<span style="display:inline-block;white-space:nowrap">${inner}</span>`;
  }).join(', ');
}
function cvReadRow(label,value,raw){
  return`<div class="cv-rread"><div class="cv-rl">${label}:</div><div class="cv-rv">${raw?value:esc(value)}</div></div>`;
}
function cvMeaningsBlock(word,showFields){
  const has=f=>showFields.includes(f)&&word[f];
  const g=[];
  ['meaning','translation'].forEach(f=>{
    if(has(f))word[f].split(/;/).forEach(s=>{const t=s.trim();if(t)g.push(t);});
  });
  if(!g.length)return'';
  return`<div class="cv-meanings">${g.slice(0,7).map((s,i)=>`<div class="cv-mn"><span class="cv-mi">${i+1}.</span><span class="cv-mt">${esc(s)}</span></div>`).join('')}</div>`;
}
function buildCardVariant(word,showFields,dataType){
  if(!word||!showFields||!showFields.length)return'<div style="color:var(--t2);text-align:center">—</div>';
  const has=f=>showFields.includes(f)&&word[f];
  const isKanjiType=dataType==='kanji';
  const kanaOnly=dataType==='words'&&S.wordDisplay==='kana'&&!!word.reading;
  const mHtml=cvMeaningsBlock(word,showFields);

  // Build readings (right side of top row)
  const reads=[];
  if(isKanjiType){
    let onR=word.on_reading,kunR=word.kun_reading;
    if((!onR||!kunR)&&word.reading){
      const sp=splitOnKun([word.reading,onR,kunR].filter(Boolean).join('・'));
      onR=onR||sp.on_reading;kunR=kunR||sp.kun_reading;
    }
    if(showFields.includes('on_reading')&&onR)reads.push(cvReadRow('on',onR));
    if(showFields.includes('kun_reading')&&kunR)reads.push(cvReadRow('kun',renderKun(kunR),true));
  }else{
    // В режиме «только кана» само слово уже показано каной — строку чтения не дублируем
    if(has('reading')&&!(kanaOnly&&has('kanji')))reads.push(cvReadRow('kana',word.reading));
  }
  const readsHtml=reads.length?`<div class="cv-readings">${reads.join('')}</div>`:'';

  // Top row: main char + readings (if either exists)
  const mainHtml=has('kanji')?`<div class="cv-main">${esc(kanaOnly?word.reading:word.kanji)}</div>`:'';
  let topHtml='';
  if(mainHtml||readsHtml){
    topHtml=`<div class="cv-top">${mainHtml}${readsHtml}</div>`;
  }

  if(!topHtml&&!mHtml){
    if(has('notes'))return`<div class="cv-root"><div style="font-size:12px;color:var(--t2);font-style:italic">${esc(word.notes)}</div></div>`;
    return'<div style="color:var(--t2);text-align:center">—</div>';
  }
  return`<div class="cv-root">${topHtml}${mHtml}</div>`;
}

/* ── Card Front Builder ── */
function buildCardFront(word,frontField,dataType){
  const isKanjiType=dataType==='kanji';
  const val=word[frontField]||'—';
  if(frontField==='kanji'){
    if(isKanjiType)return`<div class="fc-kanji">${esc(val)}</div>`;
    return`<div class="fc-main">${esc(wordGlyph(word,dataType))}</div>`;
  }
  if(frontField==='on_reading'){
    return`<div class="fc-lbl">on</div><div class="cv-kana-lg">${esc(val)}</div>`;
  }
  if(frontField==='kun_reading'){
    return`<div class="fc-lbl">kun</div><div class="cv-kana-lg">${renderKun(val)}</div>`;
  }
  if(frontField==='reading'){
    return`<div class="cv-kana-lg">${esc(val)}</div>`;
  }
  if(frontField==='meaning'||frontField==='translation'){
    const g=[];val.split(/;/).forEach(s=>{const t=s.trim();if(t)g.push(t);});
    if(g.length)return`<div class="fc-lbl">Значение</div><div class="cv-meanings">${
      g.slice(0,4).map((s,i)=>`<div class="cv-mn"><span class="cv-mi">${i+1}.</span><span class="cv-mt">${esc(s)}</span></div>`).join('')
    }</div>`;
  }
  return`<div class="fc-lbl">${fldLabel(frontField,dataType)}</div><div class="fc-main sm">${esc(val)}</div>`;
}

/* ── Render ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){document.getElementById('app').innerHTML=buildApp();bindAll();}

function buildApp(){
  if(S.screen==='import')return buildImport();
  if(S.studyQueue.length&&!S.studyResults)return buildStudyActive()+nav();
  if(S.quizQ)return buildQuizActive()+nav();
  if(S.cfgScreen)return buildCfgScreen()+nav();
  switch(S.tab){
    case'home':    return buildHome()+nav();
    case'words':   return buildWords()+nav();
    case'settings':return buildSettings()+nav();
  }
  return buildHome()+nav();
}

/* ── NAV (новый дизайн: 3 таба) ── */
const TABS=[
  {id:'home',    img:ASSETS.navHome, lbl:'Главная'  },
  {id:'words',   img:ASSETS.navDict, lbl:'Словарь'  },
  {id:'settings',img:ASSETS.navSet,  lbl:'Настройки'},
];
function nav(){
  const cur=S.cfgScreen?'home':S.tab; // конфиг-экран открыт с главной
  return`<nav class="bnav">${TABS.map(t=>{
    const active=cur===t.id;
    return`<button class="bnav-btn${active?' active':''}" data-a="tab:${t.id}">
      <span class="bnav-icon"><img src="${t.img}" alt=""${active?'':' style="opacity:.5;filter:grayscale(.6)"'}></span>
      <span>${t.lbl}</span>
    </button>`;}).join('')}</nav>`;
}

/* ── HOME (новый дизайн) ── */
function buildHome(){
  const type=S.homeTab,d=ds(type),p=pr(type);
  const total=d.length,know=d.filter(w=>statusOf(p,w.id)==='know').length;

  const cards=type==='kanji'
    ? card(ASSETS.cCards,'Карточки','open-cfg:cards')
      +card(ASSETS.cQuiz,'Квиз','open-cfg:quiz')
      +card(ASSETS.cCompose,'Собрать слово','open-cfg:quiz-compose')
      +card(ASSETS.cPair,'Найти пару','open-cfg:quiz-pairs')
      +`<button class="nimport" data-a="go-import-home"><img src="${ASSETS.cImport}" alt="">Импортировать</button>`
    : card(ASSETS.cCards,'Карточки','open-cfg:cards')
      +card(ASSETS.cQuiz,'Квиз','open-cfg:quiz')
      +`<button class="nimport" data-a="go-import-home"><img src="${ASSETS.cImport}" alt="">Импортировать</button>`;
  return`
    <div class="nlogo"><img src="${ASSETS.logo}" alt="日本語"></div>
    <div class="nseg">
      <button class="nseg-btn${type==='words'?' on':''}" data-a="home-tab:words">Слова</button>
      <button class="nseg-btn${type==='kanji'?' on':''}" data-a="home-tab:kanji">Кандзи</button>
    </div>
    <div class="nstats">
      <div class="nstat g"><div class="n">${know}</div><div class="l">Знаю</div></div>
      <div class="nstat y"><div class="n">${learning}</div><div class="l">Учу</div></div>
      <div class="nstat r"><div class="n">${unk}</div><div class="l">Не знаю</div></div>
    </div>
    <div class="nprog">
      <div class="nprog-bar"><i style="width:${pct}%"></i></div>
      <div class="nprog-info"><span>${pct}%</span><span>${know} из ${total} изучено</span></div>
    </div>
    <div class="ncards">${cards}</div>`;
}

/* ── Экран настроек режима (открывается с карточки на главной) ──
 * Сегмент Слова/Кандзи вверху (как в новом дизайне), назад — через таб «Главная». */
function buildCfgScreen(){
  if(S.studyResults)return buildStudyDone();
  const isCards=S.cfgScreen==='cards';
  const mode=S.quizCfg.mode;
  // Спец-режимы (запущены с главной, только кандзи) — заголовок вместо сегмента
  if(!isCards&&(mode==='compose'||mode==='pairs')){
    const title=mode==='compose'?'Собрать слово':'Найти пару';
    return`<div class="cfg-hdr"><button class="cfg-hdr-back" data-a="close-cfg">←</button><span class="cfg-hdr-title">${title}</span></div>`+buildQuizCfg();
  }
  const type=isCards?S.studyCfg.type:S.quizCfg.type;
  const seg=`<div class="nseg" style="padding-top:24px">
    <button class="nseg-btn${type==='words'?' on':''}" data-a="cfg-type:words">Слова</button>
    <button class="nseg-btn${type==='kanji'?' on':''}" data-a="cfg-type:kanji">Кандзи</button>
  </div>`;
  return seg+(isCards?buildCardsCfg():buildQuizCfg());
}

function cfgCard(lbl,content){
  return`<div class="cfg-card"><div class="cfg-lbl">${lbl}</div>${content}</div>`;
}
function chips(items,activeVal,actionPrefix){
  return`<div class="chips">${items.map(it=>`<button class="chip${it.v===activeVal?' on':''}" data-a="${actionPrefix}:${it.v}">${it.l}</button>`).join('')}</div>`;
}
function folderChips(type,selected,actionPrefix){
  const allOn=!selected||!selected.length;
  return`<div class="chips">
    <button class="chip${allOn?' on':''}" data-a="${actionPrefix}:__all__">Все</button>
    ${foldersOf(type).map(f=>`<button class="chip${selected&&selected.includes(f)?' on':''}" data-a="${actionPrefix}:${esc(f)}">${esc(f)}</button>`).join('')}
  </div>`;
}

function buildCardsCfg(){
  const type=S.studyCfg.type;
  const d=ds(type);
  if(!d.length)return noData(type);
  const flds=type==='kanji'?KF:WF;
  const cnt=filtered(type,S.studyCfg.filter,S.studyCfg.count,S.studyCfg.folders).length;
  const filterOpts=[{v:'all',l:'Все'},{v:'unknown',l:'Не знаю'},{v:'learning',l:'Учу'},{v:'know',l:'Знаю'}];
  const counts=[{v:'50',l:'50'},{v:'100',l:'100'},{v:'150',l:'150'},{v:'all',l:'Все'}];
  return`
    ${foldersOf(type).length>1?cfgCard('Папки',folderChips(type,S.studyCfg.folders,'study-folder')):''}
    ${cfgCard('Лицевая сторона',`<div class="chips" id="chips-front">${flds.map(k=>`<button class="chip${S.studyCfg.front.includes(k)?' on':''}" data-field-front="${k}">${fldShort(k,type)}</button>`).join('')}</div>`)}
    ${cfgCard('Оборотная сторона',`<div class="chips" id="chips-back">${flds.map(k=>`<button class="chip${S.studyCfg.back.includes(k)?' on':''}" data-field="${k}">${fldShort(k,type)}</button>`).join('')}</div>`)}
    <div class="cfg-row">
      ${cfgCard('Фильтр',chips(filterOpts,S.studyCfg.filter,'study-filter'))}
      ${cfgCard('Количество',chips(counts,S.studyCfg.count,'study-count'))}
    </div>
    <div class="start-row"><button class="start-btn" data-a="start-study">Начать (${cnt})</button></div>`;
}

function buildQuizCfg(){
  const type=S.quizCfg.type;
  const d=ds(type);
  if(d.length<4)return`<div class="empty"><div class="ei">🎯</div><div class="et">Мало данных</div><div class="eb">Нужно минимум 4 записи (сейчас ${d.length})</div><button class="btn btn-p" style="margin:0 16px;width:calc(100%-32px)" data-a="go-import-home">Импорт</button></div>`;
  const flds=type==='kanji'?KF:WF;
  const filterOpts=[{v:'all',l:'Все'},{v:'unknown',l:'Не знаю'},{v:'learning',l:'Учу'},{v:'know',l:'Знаю'}];
  const counts=[{v:'50',l:'50'},{v:'100',l:'100'},{v:'150',l:'150'},{v:'all',l:'Все'}];
  // «Режим ответа» — только базовые режимы; pairs/compose запускаются с главной
  const modes=[{v:'choice4',l:'4 варианта'},{v:'choice6',l:'6 вариантов'},{v:'input',l:'Вписать ответ'},{v:'mix',l:'Смешанный'}];
  if(type!=='kanji'&&(S.quizCfg.mode==='pairs'||S.quizCfg.mode==='compose'))S.quizCfg.mode='choice6';
  const mode=S.quizCfg.mode;
  const special=mode==='pairs'||mode==='compose'; // спец-режимы с главной: без «Режим ответа» и полей
  const noFields=special;
  const aFields=arr(S.quizCfg.answer);
  const cmode=S.quizCfg.composeMode||'normal';
  const udiff=S.quizCfg.ultraDifficulty||'all';
  const composeCfg=mode==='compose'
    ?cfgCard('Направление',`<div class="chips">
        <button class="chip${cmode==='normal'?' on':''}" data-a="compose-dir:normal">Собрать слово</button>
        <button class="chip${cmode==='reverse'?' on':''}" data-a="compose-dir:reverse">Собрать чтение</button>
        <button class="chip${cmode==='ultra'?' on':''}" data-a="compose-dir:ultra">Ultra</button>
      </div>`)
      +(cmode==='ultra'
        ?cfgCard('Сложность',chips([{v:'all',l:'Все'},{v:'easy',l:'Лёгкие'},{v:'medium',l:'Средние'},{v:'hard',l:'Сложные'}],udiff,'ultra-diff'))
        :cfgCard('Показывать на канвасе',`<div class="chips">
        ${cmode==='reverse'?'':`<button class="chip${S.quizCfg.composeShow.reading?' on':''}" data-a="compose-switch:reading">Кана</button>`}
        <button class="chip${S.quizCfg.composeShow.meaning?' on':''}" data-a="compose-switch:meaning">Значение</button>
      </div>`))
    :'';
  return`
    ${foldersOf(type).length>1?cfgCard('Папки',folderChips(type,S.quizCfg.folders,'quiz-folder')):''}
    ${special?'':cfgCard('Режим ответа',chips(modes,mode,'quiz-mode'))}
    ${noFields?'':cfgCard('Что в вопросе (несколько)',`<div class="chips" id="chips-q">${flds.map(k=>`<button class="chip${S.quizCfg.question.includes(k)?' on':''}" data-qfield="${k}">${fldShort(k,type)}</button>`).join('')}</div>`)}
    ${noFields?'':cfgCard('Что отгадываем (несколько)',`<div class="chips">${flds.map(k=>`<button class="chip${aFields.includes(k)?' on':''}" data-a="quiz-afield:${k}">${fldShort(k,type)}</button>`).join('')}</div>`)}
    ${composeCfg}
    <div class="cfg-row">
      ${cfgCard('Фильтр',chips(filterOpts,S.quizCfg.filter,'quiz-filter'))}
      ${cfgCard('Количество',chips(counts,S.quizCfg.count,'quiz-count'))}
    </div>

/* ── Kanji hint block (Figma: Подсказка_квиз_кандзи) ──
 * Кнопка «Включить подсказки» → чипы «слово + кана» из словаря,
 * содержащие текущий иероглиф. Общая для квиза и карточек. */
function buildHintBlock(item,on,toggleAction){
  if(!S.hintsEnabled)return''; // подсказки отключены в настройках
  const ch=item&&item.kanji?String(item.kanji):'';
  if(!ch)return'';
  // Тумблер всегда виден: включает и выключает подсказки
  const btn=`<button class="hint-btn${on?' on':''}" data-a="${toggleAction}">${on?'Скрыть подсказки':'Показать подсказки'}</button>`;
  if(!on)return btn;
  const words=exampleWords(ch).slice(0,6);
  const rows=words.length
    ?`<div class="hint-row">${words.map(w=>`<div class="hint-chip"><span class="hint-word">${esc(w.kanji)}</span>${w.reading?`<span class="hint-read">kana: <b>${esc(w.reading)}</b></span>`:''}</div>`).join('')}</div>`
    :`<div class="hint-row"><div class="hint-empty">Нет слов с этим иероглифом в словаре</div></div>`;
  return btn+rows;
}

/* ── QUIZ ACTIVE ── */
function buildQuizActive(){
  const q=S.quizQ;if(!q)return'';
  const{ok,bad}=S.quizScore;
  if(q.multi)return buildMultiActive(q);
  if(q.compose)return buildComposeActive(q);
  if(q.pairs)return buildPairsActive(q);
  const mode=S.quizCfg.mode;
  const showChoice=mode==='choice4'||mode==='choice6'||(mode==='mix'&&!q.mixInput);
  const showInput=mode==='input'||(mode==='mix'&&q.mixInput);
  const optN=mode==='choice4'?4:6;

  const scoreBar=`
    <div class="qscore">
      <div class="qbadge qbad">
        <svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 1l10 8M11 1L1 9" stroke="#ff4f4f" stroke-width="1.8" stroke-linecap="round"/></svg>
        ${bad}
      </div>
      <div class="qbadge qok">
        <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5l4 4L13 1" stroke="#7aff78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${ok}
      </div>
      <div class="qbadge">итого ${ok+bad}</div>
    </div>`;

  const qCard=`
    <div class="quiz-q">
      ${buildCardVariant(q.word,q.qFields,S.quizCfg.type)}
    </div>`;

  let choiceHtml='';
  if(showChoice&&q.options){
    choiceHtml=`<div class="quiz-panel">
      <div class="quiz-panel-lbl">Выберите вариант:</div>
      <div class="quiz-opts">
      ${q.options.map((opt,i)=>{
        let cls='';
        if(S.quizDone)cls=i===q.correct?'ok':i===S.quizSel?'bad':'';
        else if(i===S.quizSel)cls='sel';
        const txt=q.aField==='kun_reading'?renderKun(opt):esc(opt);
        return`<button class="qopt ${cls}" ${S.quizDone?'disabled':''} data-a="quiz-ans:${i}">${txt}</button>`;
      }).join('')}
      </div>
    </div>`;
  }

  let inputHtml='';
  if(showInput){
    const isOk=S.quizDone?checkAns(S.quizInputVal,q.options[q.correct]):null;
    const iCls=S.quizDone?(isOk?'ok':'bad'):'';
    inputHtml=`
      <div class="quiz-panel">
        <div class="quiz-panel-lbl">Впишите вариант:</div>
        <input id="quiz-input" class="quiz-inp ${iCls}" type="text"
          placeholder="Ваш ответ..."
          value="${S.quizDone?esc(S.quizInputVal):''}"
          ${S.quizDone?'disabled':''}
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        ${S.quizDone?`<div class="quiz-result ${isOk?'ok':'bad'}">${isOk?'✓ Правильно!':'✗ Правильно: '+(q.aField==='kun_reading'?renderKun(q.options[q.correct]):esc(q.options[q.correct]))}</div>`:''}
      </div>`;
  }

  const actions=`
    <div class="quiz-actions">
      <button class="qact-btn" data-a="stop-quiz">Стоп</button>
      <button class="qact-btn" data-a="skip-q">Пропустить</button>
    </div>`;

  const nextBtn=S.quizDone
    ?`<button class="next-btn" data-a="next-q">Следующий →</button>`
    :(showInput?`<button class="next-btn" data-a="quiz-check">Проверить</button>`:'');

  const hintHtml=S.quizCfg.type==='kanji'?buildHintBlock(q.word,S.quizHint,'toggle-hint'):'';

  return`<div class="pg">${scoreBar}${qCard}${hintHtml}${choiceHtml}${inputHtml}${actions}${nextBtn}</div>`;
}
/* ── #3 Мультиполевой рендер: группа вариантов/ввода на каждое поле ответа ── */
function buildMultiActive(q){
  const type=S.quizCfg.type;
  const qCard=`<div class="quiz-q">${buildCardVariant(q.word,q.qFields,type)}</div>`;
  const panels=q.groups.map((g,gi)=>{
    const lbl=fldShort(g.field,type);
    if(q.useInput){
      const val=(q.inputs&&q.inputs[gi])||'';
      const isOk=S.quizDone?checkAns(val,g.correct):null;
      const iCls=S.quizDone?(isOk?'ok':'bad'):'';
      const corr=g.field==='kun_reading'?renderKun(g.correct):esc(g.correct);
      return`<div class="quiz-panel">
        <div class="quiz-panel-lbl">${lbl}:</div>
        <input id="multi-input-${gi}" class="quiz-inp ${iCls}" type="text" placeholder="Ваш ответ..."
          value="${S.quizDone?esc(val):''}" ${S.quizDone?'disabled':''}
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        ${S.quizDone&&!isOk?`<div class="quiz-result bad">✗ ${corr}</div>`:''}
      </div>`;
    }
    const sel=q.picks[gi];
    const opts=g.options.map((opt,i)=>{
      let cls='';
      if(S.quizDone)cls=i===g.correctIdx?'ok':(sel===i?'bad':'');
      else if(sel===i)cls='sel';
      const txt=g.field==='kun_reading'?renderKun(opt):esc(opt);
      const dis=(sel!=null||S.quizDone)?'disabled':'';
      return`<button class="qopt ${cls}" ${dis} data-a="multi-pick:${gi}:${i}">${txt}</button>`;
    }).join('');
    return`<div class="quiz-panel"><div class="quiz-panel-lbl">${lbl}:</div><div class="quiz-opts">${opts}</div></div>`;
  }).join('');
  const nextBtn=S.quizDone
    ?`<button class="next-btn" data-a="next-q">Следующий →</button>`
    :(q.useInput?`<button class="next-btn" data-a="multi-check">Проверить</button>`:'');
  const hintHtml=type==='kanji'?buildHintBlock(q.word,S.quizHint,'toggle-hint'):'';
  return`<div class="pg">${qScoreBar()}${qCard}${hintHtml}${panels}${qActions}${nextBtn}</div>`;
}
// Завершение мультиполевого вопроса: оценка по числу ошибок (как было в «Все три»)
function finishMulti(q){
  let wrong=0;
  q.groups.forEach((g,gi)=>{
    const ok=q.useInput?checkAns((q.inputs&&q.inputs[gi])||'',g.correct):(q.picks[gi]===g.correctIdx);
    if(!ok)wrong++;
  });
  const quality=wrong===0?5:wrong===1?3:1;
  smUpdate(pr(S.quizCfg.type),q.word.id,quality);
  if(wrong===0)S.quizScore.ok++;else S.quizScore.bad++;
  S.quizDone=true;save();
}

/* Общий score-bar (крестик / галочка / итого) */
function qScoreBar(){
  const{ok,bad}=S.quizScore;
  return`<div class="qscore">
    <div class="qbadge qbad"><svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 1l10 8M11 1L1 9" stroke="#ff4f4f" stroke-width="1.8" stroke-linecap="round"/></svg>${bad}</div>
    <div class="qbadge qok"><svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5l4 4L13 1" stroke="#7aff78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>${ok}</div>
    <div class="qbadge">итого ${ok+bad}</div>
  </div>`;
}
const qActions=`<div class="quiz-actions">
    <button class="qact-btn" data-a="stop-quiz">Стоп</button>
    <button class="qact-btn" data-a="skip-q">Пропустить</button>
  </div>`;

/* Финальный стейт: фуригана — чтение каной над каждым иероглифом слова */
function furiganaHtml(word){
  if(word.seg&&word.seg.length)
    return`<div class="furi">${word.seg.map(s=>`<ruby>${esc(s.c)}<rt>${esc(s.r)}</rt></ruby>`).join('')}</div>`;
  // нет посимвольной разбивки (дзюкудзикун) — слово целиком + полное чтение
  return`<div class="furi"><ruby>${esc(word.kanji)}<rt>${esc(word.reading)}</rt></ruby></div>`;
}
/* ── COMPOSE ACTIVE (Figma: Составить слова) ── */
function buildComposeActive(q){
  const cs=S.quizCfg.composeShow||{reading:true,meaning:false};
  const reverse=!!q.reverse,ultra=!!q.ultra;
  const built=q.picks.map(i=>q.options[i]);
  const kanaLine=q.word.reading?`<div class="cmp-line"><span class="lbl">kana:</span> <span class="val">${esc(q.word.reading)}</span></div>`:'';
  const meaningLine=q.word.meaning?`<div class="cmp-line"><span class="lbl">meaning:</span> <span class="val">${esc(String(q.word.meaning).split(/;/)[0])}</span></div>`:'';
  let canvasInner;
  if(S.quizDone){
    // Финал: фуригана над иероглифами + (при ошибке) правильный ответ
    const parts=[furiganaHtml(q.word)];
    if((cs.meaning||ultra)&&q.word.meaning)parts.push(meaningLine);
    if(!q.result){
      const corr=reverse?esc(q.word.reading):esc(q.word.kanji);
      parts.push(`<div class="cmp-correct">Правильно: <span>${corr}</span></div>`);
    }
    canvasInner=`<div class="cmp-canvas">${parts.join('')}</div>`;
  } else if(reverse){
    // Reverse: показываем кандзи-слово (+значение), собираем кану
    const slots=[];
    for(let i=0;i<q.target.length;i++)slots.push(built[i]!=null?`<span class="cmp-kana">${esc(built[i])}</span>`:`<span class="cmp-slot"></span>`);
    canvasInner=`<div class="cmp-canvas"><div class="cmp-word">${esc(q.word.kanji)}</div>${cs.meaning?meaningLine:''}<div class="cmp-build">${slots.join('')}</div></div>`;
  } else if(ultra){
    // Ultra: незнакомый кандзи (нет в импорте) стоит на месте; знакомые — слоты,
    // которые юзер подставляет из своих кандзи по значению.
    let ki=0;
    const cells=q.positions.map(pp=>{
      if(!pp.known)return`<span class="cmp-ch">${esc(pp.c)}</span>`; // учимый — показан
      const filled=built[ki++];
      return filled!=null?`<span class="cmp-ch">${esc(filled)}</span>`:`<span class="cmp-slot"></span>`;
    });
    canvasInner=`<div class="cmp-canvas"><div class="cmp-build">${cells.join('')}</div>${meaningLine}</div>`;
  } else {
    // Normal: собираем кандзи, кана/значение как подсказка
    const slots=[];
    for(let i=0;i<q.target.length;i++)slots.push(built[i]!=null?`<span class="cmp-ch">${esc(built[i])}</span>`:`<span class="cmp-slot"></span>`);
    const lines=[];
    if(cs.reading)lines.push(kanaLine);
    if(cs.meaning)lines.push(meaningLine);
    canvasInner=`<div class="cmp-canvas"><div class="cmp-build">${slots.join('')}</div>${lines.join('')}</div>`;
  }
  const canvasCls=S.quizDone?(q.result?' ok':' bad'):'';
  const canvas=`<div class="quiz-q${canvasCls}">${canvasInner}</div>`;
  // Свитчеры: в reverse «Кана» скрыта; в ultra свитчеров нет (значение показано всегда)
  const sw=(k,label)=>`<button class="cmp-sw${cs[k]?' on':''}" data-a="compose-switch:${k}">${cs[k]?'<span class="cmp-arrow">→</span>':''}${label}</button>`;
  const switches=ultra?'':`<div class="cmp-switch">${reverse?'':sw('reading','Кана')}${sw('meaning','Значение')}</div>`;
  // Варианты: кандзи (normal/ultra) или части каны (reverse). В ultra — только знакомые кандзи.
  const opts=q.options.map((o,i)=>{
    const picked=q.picks.includes(i);
    let cls='';
    if(S.quizDone)cls=picked?(q.result?'ok':'bad'):'';
    else if(picked)cls='sel';
    return`<button class="qopt ${reverse?'':'kanji '}${cls}" ${S.quizDone?'disabled':''} data-a="compose-pick:${i}">${esc(o)}</button>`;
  }).join('');
  const panel=`<div class="quiz-panel"><div class="quiz-panel-lbl">Выберите вариант:</div><div class="quiz-opts">${opts}</div></div>`;
  const nextBtn=S.quizDone?`<button class="next-btn" data-a="next-q">Следующий →</button>`:'';
  return`<div class="pg">${qScoreBar()}${canvas}${switches}${panel}${qActions}${nextBtn}</div>`;
}

/* ── PAIRS ACTIVE (Figma: Выбери пару) ── */
function buildPairsActive(q){
  const counter=`<div class="pair-count"><div class="pair-count-pill">${q.found.length}/${q.total}</div></div>`;
  // Канвас
  let canvasInner,canvasCls='';
  const slot=(o,withMeaning)=>`<div class="pair-slot"><div class="pk">${esc(o.kanji)}</div>${withMeaning&&o.meaning?`<div class="pm">meaning: <b>${esc(o.meaning)}</b></div>`:''}</div>`;
  if(q.result){
    const a=q.options[q.result.a],b=q.options[q.result.b];
    canvasCls=q.result.ok?' ok':' bad';
    const readings=q.result.ok
      ?`<div class="pair-on"><span class="lbl">on:</span> <span class="val">${esc(a.onRaw)}</span></div>`
      :`<div class="pair-on"><span class="val">${esc(a.onRaw)}</span> <span class="lbl">≠</span> <span class="val">${esc(b.onRaw)}</span></div>`;
    canvasInner=`<div class="pair-canvas"><div class="pair-slots">${slot(a,q.result.ok)}${slot(b,q.result.ok)}</div>${readings}</div>`;
  } else if(q.firstPick!=null){
    const a=q.options[q.firstPick];
    canvasInner=`<div class="pair-canvas"><div class="pair-slots">${slot(a,false)}</div></div>`;
  } else {
    canvasInner=`<div class="pair-canvas"><div class="pair-hint">Выберите два иероглифа с одинаковым он-чтением</div></div>`;
  }
  const canvas=`<div class="quiz-q${canvasCls}">${canvasInner}</div>`;
  // Варианты
  const opts=q.options.map((o,i)=>{
    const found=q.found.some(f=>f.includes(i));
    const sel=q.firstPick===i;
    let cls=found?'ok':sel?'sel':'';
    const label=found?`${esc(o.kanji)}<span class="qopt-on">${esc(o.onRaw)}</span>`:esc(o.kanji);
    return`<button class="qopt kanji ${cls}" ${found||S.quizDone?'disabled':''} data-a="pairs-pick:${i}">${label}</button>`;
  }).join('');
  const panel=`<div class="quiz-panel"><div class="quiz-panel-lbl">Выберите вариант:</div><div class="quiz-opts">${opts}</div></div>`;
  const nextBtn=S.quizDone?`<button class="next-btn" data-a="next-q">Следующий →</button>`:'';
  return`<div class="pg">${qScoreBar()}${counter}${canvas}${panel}${qActions}${nextBtn}</div>`;
}

/* ── WORDS ── */
function buildWords(){
  const type=S.wordsTab,d=ds(type),p=pr(type);
  const folders=foldersOf(type);
  let wf=S.wordsFolder;
  if(wf!=='all'&&!folders.includes(wf)){wf=S.wordsFolder='all';}
  const base=wf==='all'?d:d.filter(w=>(w.folder||'Общая')===wf);
  const list=S.wordsSearch
    ?base.filter(w=>{const q=S.wordsSearch.toLowerCase();
        return(w.kanji||'').toLowerCase().includes(q)||
               (w.reading||w.on_reading||w.kun_reading||'').toLowerCase().includes(q)||
               (w.meaning||w.translation||'').toLowerCase().includes(q);})
    :base;
  const showFolderTag=wf==='all'&&folders.length>1;
  const checkSvg=`<svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5l4 4L13 1" stroke="#7aff78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const seg=`<div class="nseg" style="padding-top:24px">
      <button class="nseg-btn${type==='words'?' on':''}" data-a="words-tab:words">Слова</button>
      <button class="nseg-btn${type==='kanji'?' on':''}" data-a="words-tab:kanji">Кандзи</button>
    </div>`;
  const importBtn=`<button class="nimport" style="margin:0 16px 8px;grid-column:auto" data-a="words-import"><img src="${ASSETS.cImport}" alt="">Импортировать</button>`;
  const search=`<div class="dsearch">
      <img class="dsearch-ic" src="${ASSETS.cSearch}" alt="">
      <input id="words-search" class="dsearch-inp" type="text" placeholder="Поиск..." value="${esc(S.wordsSearch)}" autocomplete="off" autocorrect="off">
    </div>`;
  const folderTabs=folders.length>1?`<div class="wfilter" style="overflow-x:auto;flex-wrap:nowrap">
      <button class="wf-tab${wf==='all'?' on':''}" style="flex:none" data-a="words-folder:all">Все папки</button>
      ${folders.map(f=>`<button class="wf-tab${wf===f?' on':''}" style="flex:none" data-a="words-folder:${esc(f)}">${esc(f)}</button>`).join('')}
    </div>`:'';
  const item=w=>{
    const s=statusOf(p,w.id);
    const st=s==='know'?`<span class="ditem-st know">${checkSvg}</span>`:`<span class="ditem-st ${s}"><span class="dot"></span></span>`;
    const ft=showFolderTag&&(w.folder||'Общая')!=='Общая'?`<div class="dfolder">📁 ${esc(w.folder)}</div>`:'';
    let reading;
    if(type==='kanji'){
      const parts=[];if(w.on_reading)parts.push('он '+esc(w.on_reading));if(w.kun_reading)parts.push('кун '+esc(w.kun_reading));
      reading=parts.join(' · ');
    }else reading=esc(w.reading||'');
    const meaning=esc(w.meaning||w.translation||'');
    return`<div class="ditem">
        <span class="ditem-k">${esc(w.kanji)}</span>
        <span class="ditem-info">${reading?`<span class="ditem-r">${reading}</span>`:''}${meaning?`<span class="ditem-m">${meaning}</span>`:''}${ft}</span>
        ${st}
      </div>`;
  };
  return`
    ${seg}
    ${importBtn}
    ${search}
    ${folderTabs}
    ${!d.length
      ?`<div class="empty"><div class="ei">${type==='kanji'?'㊙️':'📖'}</div><div class="et">Нет ${type==='kanji'?'кандзи':'слов'}</div><div class="eb">Импортируйте CSV/TSV файл</div><button class="btn btn-p" style="margin:0 16px;width:calc(100% - 32px)" data-a="words-import">Импортировать</button></div>`
      :!base.length
      ?`<div class="empty"><div class="ei">📁</div><div class="et">Папка пуста</div><div class="eb">В папке «${esc(wf)}» пока нет ${type==='kanji'?'кандзи':'слов'}</div></div>`
      :`<div class="dlist">${list.map(item).join('')}</div>
        ${list.length!==base.length?`<div style="font-size:12px;color:var(--al);text-align:center;padding:6px">Найдено: ${list.length} из ${base.length}</div>`:''}`
    }`;
}
